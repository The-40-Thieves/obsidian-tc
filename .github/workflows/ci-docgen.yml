name: ci-docgen

# Docs drift gate (THE-476): regenerate the docgen surfaces and fail if the committed pages are
# stale. Triggers on any change that could move a documented fact (server/shared source) OR a
# hand-edit of a generated page (docs/wiki). Makes regeneration mandatory, so the tool/config
# reference can never drift from the code.
on:
  pull_request:
    paths:
      - 'packages/server/**'
      - 'packages/shared/**'
      - 'docs/wiki/**'
      - 'docs/src/content/**'
      # TREE.md's graph sections are generated from the same source paths above; listing the file
      # and its generator here catches a HAND-EDIT of a generated region, exactly as docs/wiki/**
      # does for the docgen pages.
      - 'TREE.md'
      - 'scripts/gen-tree-map.mjs'
      - '.dependency-cruiser.cjs'
      - 'bun.lock'
      - '.github/workflows/ci-docgen.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/setup-repo
      - name: docs drift gate (regenerate + fail if stale)
        working-directory: packages/server
        run: bun run docgen:render -- --check
      - name: narrative fact gate (THE-566 — no stale tool-count / golden-set numbers in prose)
        working-directory: packages/server
        run: bun run docgen:facts-check
      - name: config JSON Schema drift gate
        # The published schema is what editors read for autocomplete + inline docs on
        # obsidian-tc.config.json. It is generated from the Zod schema that already validates the
        # config, so a new key with a .describe() reaches users automatically — but only if the
        # committed artifact is regenerated. Stale here means an editor silently tells someone a
        # valid key is invalid, which is worse than having no schema at all.
        #
        # The generator also refuses to write a schema that lost its descriptions in conversion:
        # a description-free schema is still valid JSON and would still pass a file-exists check
        # while being useless.
        run: bun scripts/gen-config-schema.ts --check
      - name: TREE.md dependency-graph drift gate (THE-470)
        # TREE.md carried a standing "hand-generated and will drift" warning, and it had — the
        # committed numbers were 232 modules / 785 dependencies against a real 246 / 978. The graph
        # sections are now generated into marker regions, so this keeps them honest.
        #
        # The generator refuses to write from an empty module set rather than reporting success over
        # nothing: depcruise 18.x declares typescript <7 and this repo is on TS 7, so handed a
        # DIRECTORY it resolves zero files and exits 0. The file list is explicit for that reason.
        run: bun run map:check
      - name: embedded-migrations drift gate (THE-578)
        # db/migrations-embedded.ts inlines every migrations/*.sql so provisioning needs no
        # filesystem — that is what makes the standalone binaries work at all. If a migration is
        # added or edited without regenerating, the generated module and the .sql files disagree and
        # the binaries provision a stale schema. Like the generator above, this refuses to emit from
        # an empty source set rather than reporting success over nothing.
        run: bun run migrations:embed:check

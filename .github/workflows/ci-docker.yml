# PR gate: build the Docker image and smoke-boot it, so a Dockerfile regression is caught ON THE PR
# instead of at release time (publish.yml's build-docker pushes straight to ghcr.io on a v* tag).
# Build-only (no registry push) + a version smoke. This is also the gate the multi-stage Dockerfile
# rewrite can iterate against (THE-276).
name: ci-docker

on:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "packages/server/**"
      - "packages/shared/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/ci-docker.yml"
  workflow_dispatch:

concurrency:
  group: ci-docker-${{ github.ref }}
  cancel-in-progress: true

# Least privilege (CodeQL actions/missing-workflow-permissions): this job only checks out and
# builds the image locally (no registry push); the gha layer cache uses the Actions runtime token.
permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: build image (no push, load into the local daemon)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: obsidian-tc:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Mirrors ci-install-smoke's `cli.js version` check, but inside the container: proves the image
      # builds, the bun runtime + bundle load, and the entrypoint runs — no vault/mount/stdin needed.
      - name: smoke — containerized CLI reports the package version
        run: |
          want=$(node -p "require('./packages/server/package.json').version")
          got=$(docker run --rm obsidian-tc:ci version)
          echo "container reports: $got (want $want)"
          [ "$got" = "$want" ] || { echo "::error::container reports '$got', expected '$want'"; exit 1; }
          echo "ok: containerized server built and reports $want"
      # The image is already built and loaded above; scanning it here costs one extra step and
      # closes a real gap — cargo-audit/bun-audit/osv-scanner all read LOCKFILES, so none of them
      # sees the OS packages the base image ships. A vulnerable libssl in the runtime layer was
      # invisible to every existing gate.
      #
      # continue-on-error, matching the other advisory scanners in ci-security: a newly disclosed
      # base-image CVE should surface, not wall off an unrelated feature PR. It is also outside
      # this repo's control — the fix is a base-image bump, not a code change.
      - name: trivy — scan the built image for OS + library CVEs
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: obsidian-tc:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

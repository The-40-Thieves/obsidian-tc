name: ci-docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'packages/server/scripts/docgen/**'
      # The build FILLS the generated regions (tool catalog, config reference, metrics, errors) and
      # the decisions index from these, so a change to any of them changes the built site.
      - 'packages/server/src/**'
      - 'packages/shared/src/**'
      - 'packages/server/test/registered-tools.txt'
      - 'scripts/gen-decisions-index.mjs'
      - 'scripts/lib/changes.mjs'
      - 'CHANGELOG.md'
      - 'changes/**'
      - '.github/workflows/ci-docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'packages/server/scripts/docgen/**'
      # The build FILLS the generated regions (tool catalog, config reference, metrics, errors) and
      # the decisions index from these, so a change to any of them changes the built site.
      - 'packages/server/src/**'
      - 'packages/shared/src/**'
      - 'packages/server/test/registered-tools.txt'
      - 'scripts/gen-decisions-index.mjs'
      - 'scripts/lib/changes.mjs'
      - 'CHANGELOG.md'
      - 'changes/**'
      - '.github/workflows/ci-docs.yml'

permissions:
  contents: read

# Serialize publishes to the docs-site branch; never cancel one mid-push.
concurrency:
  group: docs-site
  cancel-in-progress: false

jobs:
  build:
    name: build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # bun + the ROOT install: the build's first step generates the per-tool pages from the live
      # tool registry, which needs the server package's dependencies. Node 24, not the default 26:
      # the mint CLI does not support Node 25+.
      - uses: ./.github/actions/setup-repo
        with:
          node-required: 'true'
          node-version: '24'
      - name: Install
        working-directory: docs
        run: bun install --frozen-lockfile --ignore-scripts
      # Generated pages are never committed, and Mintlify builds from a git tree with no build
      # step, so the finished site is assembled here (scripts/build-mintlify.mjs) into docs/dist.
      - name: Build (fill generated regions, decisions index, tool pages; assemble the site)
        working-directory: docs
        run: bun run build
      # Invariant: one generated page per registered tool (count == registry), no stale page, every
      # catalog row links to an existing page, and the assembled site has all of them.
      - name: tool pages match the registry (count, links, assembled site)
        working-directory: docs
        run: bun run check:tool-pages
      # mint validate --no-build: MDX parses, docs.json is valid, every navigation entry exists,
      # no foreign syntax. mint broken-links --check-anchors: every internal link and #anchor
      # resolves. Both run offline. Mintlify itself runs the full build when it deploys.
      - name: mint validate + broken-links
        working-directory: docs
        run: bun run check
      - name: Upload the assembled site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: docs/dist
          include-hidden-files: false
          retention-days: 7

  # Publish only from main; PRs stop at the checks above. The docs-site branch holds nothing but the
  # assembled site, one commit per publish (never force-pushed). The Mintlify hub repository pulls
  # it in under /reliquary-tc with mintlify/multirepo-action.
  publish:
    name: publish to docs-site branch
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-site
          path: ${{ runner.temp }}/dist
      - name: Commit the site to docs-site
        env:
          SITE: ${{ runner.temp }}/site
          DIST: ${{ runner.temp }}/dist
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin docs-site >/dev/null; then
            git fetch --depth=1 origin docs-site
            git worktree add -B docs-site "$SITE" FETCH_HEAD
          else
            git worktree add --orphan -b docs-site "$SITE"
          fi
          cd "$SITE"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "$DIST/." .
          git add -A
          if git diff --cached --quiet; then
            echo "docs-site already matches ${GITHUB_SHA}"
            exit 0
          fi
          git commit -s -m "docs-site: publish ${GITHUB_SHA::12}"
          git push origin docs-site

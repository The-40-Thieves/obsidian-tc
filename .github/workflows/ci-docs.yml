name: ci-docs

on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/ci-docs.yml']
  pull_request:
    paths: ['docs/**', '.github/workflows/ci-docs.yml']

permissions:
  contents: read

# Serialize Pages deploys; never cancel an in-flight one (a cancelled deploy can wedge the env).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install
        working-directory: docs
        run: bun install --frozen-lockfile
      - name: Build (astro check && astro build)
        working-directory: docs
        run: bun run build
      # Link-check the BUILT site, which is the only place these links can be resolved at all.
      # ci-quality's lychee job checks source markdown and deliberately EXCLUDES docs/src, because
      # a root-relative link like /tools/api-reference/ has no meaning relative to a .md file — it
      # resolves against the deployed site root. So that class of link was unchecked everywhere.
      #
      # Its first run found three real 404s: /obsidian-tc/tools/, /obsidian-tc/tools/api-reference/
      # and /obsidian-tc/configuration/config-yaml/ — stale prefixes from when this was a GitHub
      # Pages PROJECT site, left behind when it moved to a custom domain at the root. Plus a
      # /favicon.svg referenced by every page with no such file in the output.
      #
      # --offline: internal links only. External URLs rot for reasons unrelated to any PR, and a
      # gate that fails on someone else's outage teaches people to ignore it.
      - name: install lychee v0.24.2 (pinned binary + checksum)
        run: |
          mkdir -p "$RUNNER_TEMP/lychee-bin"
          curl -sSL --fail -o "$RUNNER_TEMP/lychee.tar.gz" \
            https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-musl.tar.gz
          echo "73657a111819a30c47c08352896796f23d64e4eb2b3ed39b6d32149241566fc5  $RUNNER_TEMP/lychee.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/lychee.tar.gz" -C "$RUNNER_TEMP/lychee-bin" \
            --strip-components=1 lychee-x86_64-unknown-linux-musl/lychee
          echo "$RUNNER_TEMP/lychee-bin" >> "$GITHUB_PATH"
      - name: lychee — link-check the built site (root-relative links resolve here)
        working-directory: docs
        run: lychee --offline --no-progress --root-dir "$PWD/dist" 'dist/**/*.html'
      # On main, hand the built site to the deploy job as a Pages artifact. On PRs the build
      # above is the compile check; nothing is uploaded or deployed.
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/dist

  # Publish only from main; PRs stop at the build check above. Replaces the legacy
  # "deploy from branch" Jekyll build of the repo root (which mis-rendered the monorepo).
  deploy:
    name: deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

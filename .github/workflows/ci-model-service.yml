name: ci-model-service
on:
  pull_request:
    paths:
      - 'services/bge-m3-service/**'
      - 'services/docs-ingest/**'
      - '.github/workflows/ci-model-service.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The Python BGE-M3 model service (services/bge-m3-service). Its heavy model deps (torch,
# FlagEmbedding, sentence-transformers) are lazy-imported INSIDE methods, so CI installs only the
# light surface (fastapi + pydantic + httpx + pytest) and the tests mock the model layer. No GPU,
# no weights: this gates the contracts, config, the single-worker scheduler, and the HTTP surface
# (auth, 413/429). The live model load + golden-set retrieval eval run off-CI on GPU hardware.
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/bge-m3-service
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: install package (no heavy deps) + light test deps
        # THE-528: install from a HASHED lock, not open ranges. The previous form resolved
        # `httpx`/`pytest`/`ruff` completely unconstrained and fastapi/pydantic by floor only, so
        # the job built against whatever PyPI served that day — not reproducible, and a compromised
        # or merely broken upstream release landed straight in CI. --require-hashes makes pip refuse
        # anything whose artifact does not match the lock.
        #
        # Covers the CI test surface only. The heavy ML stack (torch, FlagEmbedding,
        # sentence-transformers) is deliberately not installed here, so this lock is not a runtime
        # deployment manifest. Regenerate with:
        #   uv pip compile requirements-ci.in --generate-hashes --python-version 3.11 \
        #     -o requirements-ci.txt
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps -e .
          pip install --require-hashes -r requirements-ci.txt
      - name: ruff
        run: ruff check .
      - name: py_compile
        run: python -m py_compile obsidian_tc_bge/*.py
      - name: requirements lock covers the declared runtime deps
        # requirements.txt is a hash-verified lock of the HEAVY stack (torch, FlagEmbedding,
        # sentence-transformers) that this job deliberately never installs — it mocks the model
        # layer and installs the package --no-deps. So nothing here would otherwise notice a
        # runtime dependency added to pyproject.toml and never compiled into the lock: it would
        # stay green, stay hash-verified, and silently stop describing the service.
        #
        # Deliberately a structural comparison, NOT a recompile. Recompiling needs the network,
        # takes minutes, and churns on every upstream release — a gate people learn to ignore.
        run: python scripts/check_requirements_sync.py
      - name: pytest
        run: pytest -q

  # THE-470 hole 4: services/docs-ingest/tests/ (test_router.py, test_writer.py) had no CI at all
  # — this workflow's `paths` filter only ever named bge-m3-service, and it was the only workflow
  # in the repo that installed Python or ran pytest. A SEPARATE job (not more steps on `test`
  # above): job-level continue-on-error does not survive a failed STEP, so stacking this onto one
  # job would silently skip whichever half runs second the day the other fails.
  test-docs-ingest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/docs-ingest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: install package + test deps
        # docs-ingest's live parse/extract backends (docling, langextract) are lazy-imported
        # INSIDE the functions that need them (see pipeline.py), so the router/writer/pipeline
        # unit tests need neither — installing the `test` extra alone is enough. Unlike
        # bge-m3-service, docs-ingest has no hash-locked requirements-ci.txt yet; its own
        # pyproject.toml pins by floor only (pydantic>=2.13, pytest>=8), which is the existing
        # convention there.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: ruff
        run: ruff check .
      - name: pytest
        run: pytest -q

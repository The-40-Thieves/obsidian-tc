name: ci-security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # weekly: catch newly disclosed advisories against a static tree
  workflow_dispatch:  # allow an on-demand run of the scheduled full-repo scans below

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Supply-chain + secret gates that complement the always-on CodeQL (default setup, 4 languages)
# and Semgrep. gitleaks GATES (a committed secret must block) and scans the working tree (--no-git):
# the PR gate is about what ships, not 483 commits of immutable history. Benign secret-shaped content
# (scanner regexes, fake test fixtures, doc examples, build output) is allowlisted in .gitleaks.toml.
# The dependency audits are continue-on-error: a newly disclosed transitive advisory should surface,
# not wall off an unrelated feature PR. gitleaks runs via the official image to avoid the org-license
# requirement of gitleaks-action.
jobs:
  vault-leak:
    # This public repo served a map of a personal vault for two weeks: 227 real note paths, 136 plain-
    # English descriptions of their contents, and a committed SQLite index holding the FULL TEXT of 100
    # notes. Six code reviews missed it -- every one audited the DIFF, none audited the REPO.
    #
    # STRUCTURAL only: CI has no vault, so it cannot tell a real note title from an invented one. The
    # deep check (--vault <path>) runs where the vault lives, which is where such a leak originates.
    name: vault leak (structural)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: node scripts/check-vault-leak.mjs

  config-threading:
    # knnMinSim shipped DECLARED but unthreaded: it typechecked, it validated, it was documented, and
    # nothing read it. An ablation arm was measured against a config no operator could select. A config
    # key that reaches no consumer is a promise to the operator the code does not keep.
    name: config threading
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: node scripts/check-config-threading.mjs

  nul-bytes:
    # A literal NUL byte makes a source file BINARY to git and grep: `git diff` degrades to "Binary
    # files differ", so changes to it ship without a reviewable diff, and every grep-based guard,
    # codemod and SAST sweep skips it while still reporting success. Three files carried one.
    name: no NUL bytes in tracked text
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: node scripts/check-nul-bytes.mjs

  workflow-injection:
    # THE-541: `${{ }}` is expanded into the script TEXT before the shell runs, so an untrusted
    # value carrying a quote plus shell metacharacters executes on the runner with the job's token.
    # The instance found was harmless only because every caller passed a literal — an invariant
    # nothing enforced, on an action THE-505 is about to spread across every workflow.
    name: no untrusted context in shell steps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: node scripts/check-workflow-injection.mjs

  actionlint:
    # Kept ALONGSIDE check-workflow-injection.mjs above, not instead of it. That script encodes a
    # deliberate repo policy — an explicit allow-list of contexts this workflow set fixes itself
    # (matrix.*, runner.*, github.workspace, …) so the signal stays actionable. actionlint's
    # injection check is broader and differently tuned; the two disagree in both directions, and
    # dropping the narrow one would trade a curated gate for a generic one.
    #
    # What actionlint adds on top: expression-level type and ARITY checking, plus shellcheck over
    # every embedded `run:` block (ubuntu-latest ships shellcheck). Its first run on this repo found
    # a `format()` called with one argument on the `:latest` docker-tag line of BOTH release
    # workflows — inside jobs the `dry_run` guard skips, so the dry runs that proved all 8 native
    # targets never once evaluated those expressions. That is the class of bug this gates against:
    # broken only on the real-tag path, invisible to every rehearsal.
    #
    # THE-940 review finding N2: `actionlint -color` (below) globs `.github/workflows/**` only —
    # it has no composite-action mode, and pointing it at a `.github/actions/*/action.yml` directly
    # parses it AS a workflow and reports `"jobs" section is missing`. Proven, not inferred: a
    # textbook SC2086 was appended to `install-mcp-publisher/action.yml` (added for THE-940) and
    # this exact job still exited 0. `check-actions-shellcheck.mjs` closes that hole by extracting
    # every composite action's `run:` block and shellchecking it directly — the same tool this
    # job's own actionlint step already applies to every workflow-embedded `run:` block, so
    # composite actions are held to the identical bar. Kept in THIS job (not a separate one) so the
    # "shell coverage" claim in this job's name stays true of the whole job, not just half of it.
    #
    # GATES (no continue-on-error), unlike the audit jobs below: this is a static check of files in
    # the repo with no external advisory feed, so it cannot start failing on its own overnight.
    name: actionlint (workflow lint + shell + expression checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: install actionlint v1.7.12 (pinned binary + checksum)
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint-bin"
          curl -sSL --fail -o "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint-bin" actionlint
          echo "$RUNNER_TEMP/actionlint-bin" >> "$GITHUB_PATH"
      - name: actionlint
        run: actionlint -color
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: shellcheck composite actions (THE-940, actionlint does not cover .github/actions)
        run: node scripts/check-actions-shellcheck.mjs

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: gitleaks (secret scan of the working tree; honors .gitleaks.toml)
        # THE-426: pin the scanner image to an immutable digest (was :latest). Refresh with
        # `docker manifest inspect ghcr.io/gitleaks/gitleaks:latest | grep -m1 digest`.
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            detect --no-git --source /repo --config /repo/.gitleaks.toml --no-banner --redact --exit-code 1

  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: install trufflehog v3.96.0 (pinned binary + checksum)
        run: |
          mkdir -p "$RUNNER_TEMP/th-bin"
          curl -sSL --fail -o "$RUNNER_TEMP/th.tar.gz" \
            https://github.com/trufflesecurity/trufflehog/releases/download/v3.96.0/trufflehog_3.96.0_linux_amd64.tar.gz
          echo "7105f1cd6577f058a9e39d0578f1a99c8a1e481e4d3512cd8a09acfe22a0fdc0  $RUNNER_TEMP/th.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/th.tar.gz" -C "$RUNNER_TEMP/th-bin" trufflehog
          echo "$RUNNER_TEMP/th-bin" >> "$GITHUB_PATH"
      - name: trufflehog (VERIFIED secrets only)
        # Complements gitleaks rather than duplicating it. gitleaks answers "does this look like a
        # credential" from patterns; trufflehog --only-verified answers "is this credential LIVE"
        # by calling the issuing provider. A repo full of secret-shaped test fixtures — which this
        # one deliberately is, see .gitleaks.toml's allowlist — makes the second question the
        # useful one, because it cannot be tripped by a fixture.
        #
        # Baseline on this repo at wiring time: 134152 chunks / 1.35 GB scanned,
        # verified_secrets=0, unverified_secrets=0.
        #
        # HONEST LIMITATION: verification is a network call, so this gate FAILS OPEN. If a
        # provider's endpoint is unreachable, a live credential degrades to "unverified" and this
        # job stays green. That is the deliberate trade — a network-dependent gate that fails
        # CLOSED on someone else's outage trains people to ignore it (same reasoning as lychee
        # --offline in ci-quality). gitleaks is the fail-closed half of the pair and runs on every
        # PR regardless, so a plaintext credential is still caught with no network at all.
        #
        # --no-update: the binary is checksum-pinned above; letting it self-update at runtime would
        #   silently replace the thing that was verified.
        # --fail: trufflehog exits 0 WITH FINDINGS unless this is passed. Without it this job is
        #   green no matter what it finds.
        #
        #   CORRECTION 2026-08-06: this said "verified at wiring time against a seeded RSA private
        #   key: exit 183, Detector Type: PrivateKey". That does NOT reproduce under the flags on
        #   this line. Re-run today: a freshly generated RSA key dropped in the tree gives exit 0,
        #   because `--only-verified` VERIFIES a private key against remote services and a key that
        #   exists nowhere cannot verify. The detector is armed — dropping --only-verified reports
        #   it as `Found unverified result / Detector Type: PrivateKey` — but the seeded-key floor
        #   test as written proves nothing about THIS invocation.
        #
        #   So the honest statement of what this job catches: a credential that is BOTH detectable
        #   AND live. A leaked-but-revoked key, or a well-formed key that was never registered
        #   anywhere, is invisible to it. gitleaks (fail-closed, pattern-based, every PR) is the
        #   half that catches those, which is why the pair exists.
        # --fail-on-scan-errors: narrows the fail-open window above. A scan that errors part-way
        #   otherwise reports "0 verified" — identical output to a clean repo.
        # --exclude-detectors=lob: the Lob detector VERIFIED the pytest function name
        #   `test_rerank_requires_query_and_documents` as a live Lob key on 2026-08-06, under
        #   --only-verified. Every run before ~15:00 UTC passed and every run after failed, on any
        #   branch including a one-file docs PR; the binary is pinned (--no-update) and the file is
        #   unchanged since #248, so the moving part is Lob's remote verification, not this repo.
        #
        #   Scoped to ONE detector on purpose. Lob is a direct-mail/address-verification API
        #   (postcards, letters, address validation) and obsidian-tc has no postal surface, no
        #   customers and no outbound physical mail — so its true-positive rate here is ZERO BY
        #   CONSTRUCTION, and dropping it costs no coverage. Every other detector stays armed.
        #
        #   The alternative considered and rejected: allow-listing the one string. That fixes one
        #   line and leaves the detector free to verify the next arbitrary identifier, which is the
        #   failure mode being removed rather than a different one.
        run: trufflehog filesystem . --only-verified --no-update --fail --fail-on-scan-errors --exclude-detectors=lob

  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: install checkov 3.2.395 (version-pinned)
        # Pinned, not floating: checkov ships new CHECKS in minor releases, so "latest" means an
        # unrelated PR turns red the week a rule is added. The same reasoning pins it in the host
        # mise config. Bump deliberately, and re-run the baseline when doing so.
        run: pip install --disable-pip-version-check checkov==3.2.395
      - name: checkov (Dockerfile + GitHub Actions policy)
        # Exceptions live in .checkov.yml with their reasons, matching how _typos.toml and
        # .gitleaks.toml carry this repo's other scanner exceptions. Two rules are skipped there;
        # 996 checks still run (58 Dockerfile + 938 workflows at wiring time).
        #
        # --framework is explicit so the run cannot silently widen: checkov auto-detects ~30
        # frameworks, and a future terraform/ or helm/ directory appearing in the repo would
        # otherwise start gating this job on rules nobody reviewed.
        run: |
          set -euo pipefail
          checkov --config-file .checkov.yml --quiet --compact \
            --framework dockerfile --framework github_actions \
            -f Dockerfile -d .github/workflows

  cargo-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: packages/native
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/setup-rust
      - name: install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        run: cargo audit

  cargo-deny:
    # cargo-audit above answers one question: "is a dependency subject to a published advisory?"
    # It says nothing about LICENCES — and this crate ships as a compiled artifact inside a PUBLIC
    # npm package across 8 targets, so a copyleft dependency arriving transitively would be a real
    # distribution problem found at the worst possible moment. cargo-deny adds that, plus banned
    # crates and registry provenance (no git deps, crates.io only).
    #
    # GATES, unlike cargo-audit: the licence/ban/source policy in packages/native/deny.toml is a
    # static assertion about the dependency graph, so it cannot start failing on its own overnight
    # the way an advisory feed can. Its advisory section is left at `warn` precisely so the two jobs
    # do not both hard-fail on the same newly-disclosed CVE.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/native
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/setup-rust
      - name: install cargo-deny
        run: cargo install cargo-deny --locked
      - name: cargo deny check
        run: cargo deny check

  bun-audit:
    # osv-scanner (below) is the SECOND advisory feed for every lockfile in this repo, and it does
    # not depend on npm's bulk advisory endpoint at all. A bun-audit red whose log shows ONLY
    # registry errors (503/502/504/timeout/ConnectionClosed/ETIMEDOUT/ECONNRESET against
    # /-/npm/v1/security/advisories/bulk) is an OUTAGE, not a finding — read osv-scanner's result
    # for this same PR before treating it as one. THE-953: on 2026-09-04 that endpoint answered
    # 503, or nothing at all, for two hours straight (GitHub runners AND Cave alike), and `bun
    # audit` has no retry of its own, so PRs #897-#901 all sat fully green except this job, three
    # re-runs each. Each `bun audit` step below now goes through `.github/actions/bun-audit`
    # (run.sh, tested off-runner by scripts/bun-audit-retry.test.mjs), which retries such an
    # error up to 3 times with 30/60s backoff and, if every attempt is a registry error, fails
    # the STEP with a distinct `::error title=npm advisory endpoint outage::` message naming
    # osv-scanner as the second feed. A real finding (a vulnerability table) or any other
    # non-zero exit still fails on the FIRST attempt, unretried.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/setup-repo
      - name: bun audit
        uses: ./.github/actions/bun-audit
      # docs/ is a SEPARATE bun workspace with its own lockfile, and `bun audit` only walks the
      # lockfile it is invoked against — so the root run above never saw the docs toolchain. A high
      # sharp/libvips advisory sat there unnoticed until Dependabot (which scans every manifest)
      # flagged it. Audit it explicitly; the root `overrides` do not reach this tree either, so
      # docs/package.json carries its own.
      #
      # `if: always()` is load-bearing. `continue-on-error` is set at the JOB level, which decides
      # whether this job blocks the workflow — it does NOT make the job run past a failed STEP. So
      # from the moment the root audit above found anything, these three steps were skipped and the
      # docs workspace went unscanned: precisely the condition they exist to cover. PR #413 is the
      # worked example — its bun-audit log shows the root's two advisories and then stops.
      #
      # Fix round 1 (review INFO finding): "bun audit (docs workspace)" below is now `uses:` a
      # composite action, not a plain `run:` step, so this guarantee rests on how the runner
      # applies a caller's `if: always()` to a composite's own inner steps rather than on a bare
      # shell step — per actions/runner#1682, the runner treats the composite's steps as if each
      # inherited the caller's condition, so the inner audit still runs. Live run 33951060517 could
      # not exercise the failure path (nothing failed upstream that day); if this ever regresses,
      # it would look like the docs/reranker-local audits silently going unscanned again.
      - if: always()
        run: bun install --frozen-lockfile --ignore-scripts
        working-directory: docs
      - name: bun audit (docs workspace)
        if: always()
        uses: ./.github/actions/bun-audit
        with:
          working-directory: docs
      # packages/reranker-local is a THIRD separate bun workspace (its own lockfile, not a root
      # workspace member — see reranker-local's job in ci-server.yml), so it is invisible to both
      # audits above for the same reason docs/ was: `bun audit` only walks the lockfile it runs
      # against. `if: always()` for the same reason as the docs steps — a JOB-level
      # `continue-on-error` does not survive a failed STEP, so without it a failure in the root or
      # docs audit above would skip this one and leave this workspace unscanned.
      - if: always()
        run: bun install --frozen-lockfile --ignore-scripts
        working-directory: packages/reranker-local
      - name: bun audit (reranker-local workspace)
        if: always()
        uses: ./.github/actions/bun-audit
        with:
          working-directory: packages/reranker-local

  osv-scanner:
    # Cross-ecosystem dependency scan, complementing bun-audit/cargo-audit above rather than
    # replacing them. Those each walk ONE lockfile in ONE ecosystem and depend on step ordering to
    # cover the second workspace (see the `if: always()` note above). osv-scanner walks the tree and
    # scans EVERY manifest it finds in a single invocation — root bun.lock, docs/bun.lock,
    # packages/reranker-local/bun.lock, packages/native/Cargo.lock and the service requirements
    # files — against the OSV database,
    # which is a different feed from bun's. A local run over this repo covered 1183 packages across
    # 4 ecosystems in ~600ms and reported postcss once PER WORKSPACE, so a per-workspace regression
    # cannot hide behind a passing root scan.
    #
    # continue-on-error, matching the audit jobs above: a newly disclosed transitive advisory should
    # surface, not wall off an unrelated feature PR.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: install osv-scanner v2.4.0 (pinned binary + checksum)
        run: |
          mkdir -p "$RUNNER_TEMP/osv-bin"
          curl -sSL --fail -o "$RUNNER_TEMP/osv-bin/osv-scanner" \
            https://github.com/google/osv-scanner/releases/download/v2.4.0/osv-scanner_linux_amd64
          echo "15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0  $RUNNER_TEMP/osv-bin/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-bin/osv-scanner"
          echo "$RUNNER_TEMP/osv-bin" >> "$GITHUB_PATH"
      - name: osv-scanner (every lockfile in the tree)
        run: osv-scanner scan source --recursive .

  # THE-506: scheduled full-repo SAST via opengrep (the community-maintained OSS continuation of the
  # Semgrep CLI). This complements, rather than duplicates, the external `semgrep-cloud-platform`
  # GitHub App already installed on this repo: that app's PR check is diff-aware (scans only the
  # files a PR changes) and is the right place for per-PR SAST, so this job does NOT run on
  # `pull_request` -- only on the workflow's existing weekly `schedule` (plus `workflow_dispatch` for
  # an on-demand run). A full `--config auto` pass over the whole tree took ~1:40 locally; adding
  # that to every PR would be redundant CI minutes for signal the App already provides on the diff.
  # continue-on-error, matching cargo-audit/bun-audit above: a scheduled scan reports newly-matched
  # findings against a static tree (there is no PR here to block), so it should stay visible without
  # red-Xing the workflow run on an existing, un-triaged finding.
  opengrep-full-scan:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: install opengrep v1.25.0 (pinned binary + checksum)
        run: |
          mkdir -p "$RUNNER_TEMP/opengrep-bin"
          curl -sSL --fail -o "$RUNNER_TEMP/opengrep-bin/opengrep" \
            https://github.com/opengrep/opengrep/releases/download/v1.25.0/opengrep_manylinux_x86
          echo "9ac4aebb47ba3f7b0d8fc641ac8749cb6c2f253f616131a67d9631e00d4bea33  $RUNNER_TEMP/opengrep-bin/opengrep" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/opengrep-bin/opengrep"
          echo "$RUNNER_TEMP/opengrep-bin" >> "$GITHUB_PATH"
      - name: opengrep full scan (community registry ruleset, auto-detected by language)
        run: opengrep scan --config auto --error .

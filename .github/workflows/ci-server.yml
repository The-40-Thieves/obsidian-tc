name: ci-server
on:
  # THE-599: DELIBERATELY UNFILTERED. This workflow owns `lint`, `build-test` and `bun-smoke`, and
  # those are becoming REQUIRED status checks on main. A required check whose workflow never fires
  # does NOT read as clean -- GitHub leaves the PR blocked forever on "Expected -- waiting for
  # status to be reported". So a `paths:` filter here and a required check are mutually exclusive;
  # a PR touching only packages/native/**, packages/plugin/** or services/** would deadlock.
  #
  # Every one of main's previously-required checks already came from an unfiltered workflow
  # (ci-quality, ci-security, ci-version, dco). This brings ci-server into that same shape.
  #
  # The filter was ALSO already failing at its own job: THE-598 had to widen it with docs/**,
  # ARCHITECTURE.md and README.md because check:config-paths -- a gate whose entire purpose is
  # catching a dead config key in a docs-only PR -- could not be reached by a docs-only PR. That is
  # the second time a path filter made a gate unreachable. Removing it closes the class.
  #
  # Cost: the build-test matrix now runs on every PR. `perf` is unaffected -- it is gated on
  # `github.event_name == 'push'` (see the job) and still never runs on a PR.
  pull_request:
  push:
    branches: [main]
  # THE-517 follow-up: run the suite on demand, on a dedicated runner, without opening a PR.
  #
  # This repo is developed on a 4-core host that also runs ~43 containers, Falco and a remote
  # desktop; a local full-suite run costs the whole box, and concurrent runs have driven it to
  # load 28. Standard GitHub-hosted runners are FREE AND UNMETERED for public repositories, so
  # the suite that already runs on every PR can be triggered directly instead:
  #
  #     gh workflow run ci-server.yml --ref <branch>
  #     gh run watch $(gh run list -w ci-server.yml -L1 --json databaseId --jq '.[0].databaseId')
  #
  # Use this for a full-suite run mid-branch. Keep targeted vitest local — it is faster than a
  # round trip and does not saturate anything.
  #
  # `perf` is unaffected: it is gated on `github.event_name == 'push'`, and a dispatch reports
  # `workflow_dispatch`. That is deliberate — perf lives in the non-ref-scoped `perf-exclusive`
  # concurrency group, so letting ad-hoc runs into it would cancel main's pending perf jobs
  # (THE-592). `lint`, `build-test` (3 OS) and `bun-smoke` carry no event guard and do run.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/setup-repo
      - name: biome check
        run: bun run lint
      # THE-525: module boundary gate. Runs in the existing lint job rather than a new workflow so
      # it shares the checkout + install. The wrapper fails on an EMPTY scan as well as on a
      # violation — dependency-cruiser supports typescript <7 and this repo is on 7.x, where a
      # directory scan silently yields zero modules.
      - name: module boundaries (dependency-cruiser)
        run: bun run check:boundaries
      # THE-593: dependency-cruiser's own `not-to-dev-dep` rule is inert under TypeScript 7 (see
      # the note in .dependency-cruiser.cjs) — it never sees an npm-dev edge, so it never fires.
      # This source-scan gate enforces the same "no shipped import of a devDependency" intent
      # without depending on dependency-cruiser's TypeScript support.
      - name: dev-dependency imports (source scan)
        run: bun run check:dev-dep-imports
      # THE-594: guards the "relocate, don't re-tune" fix itself -- a new real-timing comparison
      # (calibrate/calibrateIo/measureIoScalingRho) landing back in packages/server/test/ would
      # reintroduce the exact class of flake (macOS, then windows-latest) this ticket closed.
      - name: perf timing-scope (source scan)
        run: bun run check:perf-timing-scope
      # THE-590: guards the ingest-telemetry fix itself -- vitest cannot catch a regression here
      # because the test that proves onIndexVaultComplete's wiring works constructs its own sink
      # rather than booting cli.ts's. This scans every indexVault() call path under
      # packages/server/src and the onIndexVaultComplete sink assignment(s) that some of them
      # delegate to, and fails if any path's stats no longer reach a recordIngestStats*(...) call.
      - name: ingest telemetry wiring (source scan)
        run: bun run check:ingest-telemetry-wiring
      # THE-598: every backticked dotted config path (`a.b.c`) in narrative docs must resolve in
      # ServerConfigSchema. Ground truth is docs/wiki/Configuration.md's own generated reference
      # table (kept fresh by the docgen drift gate), so this needs no schema re-parse of its own.
      # Four keys (traceDetail/tracesSampleRate/tracesDays/morgianaEventsDays) were deleted from the
      # schema as dead — the schema has no .strict(), so a config that still sets them validates
      # cleanly and silently does nothing. This is the mechanized guard against that recurring.
      - name: config-path existence (source scan)
        run: bun run check:config-paths
      # THE-703: ARCHITECTURE.md §3.1's companion-plugin route block is prose that happens to look
      # like a spec, and nothing could tell it apart from one — it drifted 11 routes and 6 families
      # behind the code, and listed three routes under the wrong verb (GET where they ship POST),
      # while the wiki pages covering the same surface stayed correct. Every other structural fact
      # here is generated or pinned by a parsed constant; this makes that block the same kind of
      # fact. Derived on BOTH sides, so a sixteenth route family is covered rather than exempt, and
      # floored on both, so a moved directory or a reworded heading fails instead of comparing two
      # empty sets and passing.
      - name: plugin route table vs ARCHITECTURE.md (source scan)
        run: bun run check:plugin-routes

      # DRY, as a detector rather than a principle. Every duplication that has cost time here was
      # invisible to the test suite because the copies AGREED — DEFAULT_MEMORY_FOLDER three ways
      # on a delete path, MAX_RESOURCE_BYTES vs a configurable maxResponseBytes, paginate<T> twice
      # byte-identical. Neither of these gates can be satisfied by writing a better commit message.
      - name: duplicate exported names (source scan)
        run: bun run check:duplicate-exports

      # THE-720/THE-722: a table production WRITES and nothing production READS is dead work. The
      # doctor liveness checks cannot see this — they answer "is it being written", and
      # audit_reports had 299 rows sitting green under both while nothing had ever read one.
      # "Nothing reads this" is a property of the source, so it is a scan, not a probe. Views count
      # as readers: chunk_access_stats is how note_quality reaches chunk_retrievals.
      - name: write-only tables (source scan)
        run: bun run check:table-readers

      # THE-837. embeddings/http.ts is shared by every embedding adapter, both reranker adapters
      # and both model-tier clients, so a provider name used as a VALUE there privileges one vendor
      # over the other nine in providers/registry.ts. That branch had already grown back once (see
      # providerHint's docblock), which is what makes this a standing gate rather than a point fix.
      # The provider set is DERIVED from the registry, so a provider added later is covered without
      # editing the gate. Comments naming a vendor are ignored — they are documentation, not code.
      - name: embedding transport names no vendor (source scan)
        run: bun run check:embedding-transport

      # The gate's own unit tests — the view/word-boundary/quoting cases that decide whether it
      # reports the truth or quietly reports nothing.
      - name: gate unit tests
        run: bun run test:scripts

      # Block-level copy-paste. Threshold 3% against 2.16% today — this catches a regression, it
      # does not demand zero. Some duplication is cheaper than the coupling that would remove it.
      - name: copy-paste detection
        run: bun run check:duplication

      # The facade-parity family compares the CURRENT export surface against the same file at
      # `origin/main`. actions/checkout leaves fetch-depth at 1, which gives no `origin/main` ref at
      # all — so this fetch is load-bearing, not a convenience. Depth 1 is enough: the gates only
      # read that commit's tree, never its history.
      #
      # Both gates fail closed on an unresolvable ref, so a broken fetch is loud rather than a
      # green run that compared nothing. That property was already in check-export-surface; it was
      # missing from check-facade-parity until it was added alongside this wiring.
      - name: fetch parity baseline
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main

      # These two shipped as committed, unit-tested scripts but were never invoked by any workflow,
      # so across the whole schema/M7/indexer refactor they only ever ran when someone remembered to
      # run them locally. They are the invariant that every facade extraction rests on — "the export
      # set is identical before and after" — which makes local-only the wrong place for them.
      - name: config-schema export surface (facade)
        run: bun run check:export-surface
      - name: facade parity (all extracted facades)
        run: bun run check:facade-parity

      # The gates above have their own unit tests, and those were unwired too. A gate whose tests
      # never run is a gate whose non-vacuity nobody is checking — exactly how the hardcoded
      # `files.length === 3` assertion in check-facade-parity.test.mjs survived a fourth facade
      # being added.
      - name: gate script unit tests
        run: bun run test:scripts

  build-test:
    strategy:
      fail-fast: false
      matrix:
        # The matrix covers three OSes and, until now, one ISA. That gap is not theoretical here:
        # this repo SHIPS aarch64-unknown-linux-gnu (publish.yml) and the maintainer's own
        # deployment is an Ampere Neoverse-N1, so production runs an architecture CI never
        # exercised. macos-latest is arm64 but Darwin — different libc, different SIMD paths.
        #
        # And the divergence is already measured, in this repo's own source. vec.ts:196-199:
        # "the same commit produced retrieval.ndcg_at10 0.8028 on aarch64 and 0.8414 on x86_64
        # while recall_at10 (set-based) and the candidate counts matched exactly" — exact-tie
        # ordering in the vec0 KNN cut differs by ISA. THE-582 had to reconstruct that from two
        # runs on different machines because no CI leg could show it.
        #
        # ubuntu-24.04-arm is a free hosted runner for public repositories (no Works-on-Arm
        # application needed), so this costs nothing.
        #
        # PROMOTED to a required status check 2026-07-27, after three green runs including the
        # hardest case (a changed bun.lock resolving a new dependency on aarch64). It went in
        # unrequired on purpose: a new required context that turns out flaky blocks every PR, and
        # soaking first kept the option of learning something before committing to it.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      # vitest forks Node workers; node:sqlite + --experimental-sqlite require
      # Node >=22 on PATH. setup-node provides it for the test step below.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: cache bun install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      # M0 tests use node:sqlite and do not need the native / better-sqlite3
      # compiles; --ignore-scripts mirrors the verified local + clean-room run.
      - name: install
        run: bun install --frozen-lockfile --ignore-scripts
      - name: typecheck shared (fully strict)
        run: bun run typecheck
        working-directory: packages/shared
      - name: typecheck server
        run: bun run typecheck
        working-directory: packages/server
      - name: build shared
        run: bun run build
        working-directory: packages/shared
      - name: build server
        run: bun run build
        working-directory: packages/server
      # The v8 coverage gate is platform-independent, so it runs once here on Linux
      # (folded in to avoid a separate full-suite job); macOS/Windows run the same
      # suite without instrumentation for cross-platform verification.
      - name: test server (vitest under Node; coverage gate on Linux)
        run: node ./node_modules/vitest/vitest.mjs run ${{ matrix.os == 'ubuntu-latest' && '--coverage' || '' }}
        working-directory: packages/server

  # The release-only codegen, exercised on EVERY PR. These scripts run nowhere else: build-binaries
  # lives in publish.yml, which only fires on a tag, so a bug in them is undiscoverable until the
  # release is already half-published. That is not hypothetical — v1.14.1's tag build died on
  # `spawnSync npm ENOENT`, because execFileSync does not go through a shell and Windows has only
  # npm.cmd. It could not have been caught earlier: on v1.14.0 the same job was CANCELLED by the
  # darwin failure, and a cancelled job is not a verdict.
  #
  # Deliberately does NOT compile — `bun build --compile` is minutes per target and build-binaries
  # already covers it at tag time. What has actually broken here is the codegen: npm resolution,
  # platform package fetching, cross-arch toolchain invocation. Running just that costs seconds and
  # covers the class.
  embed-codegen:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
          - os: windows-latest
            target: bun-windows-x64
          - os: macos-14
            target: bun-darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/setup-repo
      - name: embed sqlite-vec for ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/gen-embedded-vec.mjs --target ${{ matrix.target }}
          # Assert the ARTIFACT, not the exit code: the placeholder is a valid file, so "the script
          # ran" proves nothing. A real vec0 is >100 KB of base64.
          bytes=$(wc -c < packages/server/src/search/vec-embedded.ts)
          echo "vec-embedded.ts: $bytes bytes"
          [ "$bytes" -gt 100000 ] || { echo "::error::vec-embedded.ts is $bytes bytes — nothing was embedded"; exit 1; }
      - name: embed vanilla SQLite (darwin only)
        if: startsWith(matrix.target, 'bun-darwin')
        shell: bash
        run: |
          set -euo pipefail
          node scripts/gen-embedded-sqlite.mjs --target ${{ matrix.target }}
          bytes=$(wc -c < packages/server/src/db/sqlite-embedded.ts)
          echo "sqlite-embedded.ts: $bytes bytes"
          [ "$bytes" -gt 1000000 ] || { echo "::error::sqlite-embedded.ts is $bytes bytes — nothing was embedded"; exit 1; }
      - name: generated files must never be committable
        shell: bash
        run: |
          set -euo pipefail
          # Both are per-build artifacts whose committed value is the empty placeholder. If a run
          # ever leaves them staged, the next `bun install` would ship one machine's binary to every
          # platform. Confirms they are dirty HERE (so the codegen really wrote something) while
          # HEAD's copies stay empty.
          git diff --quiet -- packages/server/src/search/vec-embedded.ts && {
            echo "::error::vec-embedded.ts is unchanged — the codegen did not write"; exit 1; }
          git show HEAD:packages/server/src/search/vec-embedded.ts | grep -q 'BASE64 = ""' || {
            echo "::error::a generated vec0 was COMMITTED to HEAD"; exit 1; }
          git show HEAD:packages/server/src/db/sqlite-embedded.ts | grep -q 'BASE64 = ""' || {
            echo "::error::a generated SQLite was COMMITTED to HEAD"; exit 1; }
          echo "ok: placeholders empty at HEAD, codegen wrote locally"

  bun-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/setup-repo
      - name: bun:sqlite adapter smoke (bun test)
        run: bun test bun-smoke
        working-directory: packages/server

  acl-audit:
    # THE-607: src/vault/acl-audit.ts (THE-414 follow-up, #280) already exists and already
    # verifies that a tool's declared `pathAcl` extractor mirrors the vault paths its handler
    # actually resolves for filesystem ops -- but it is gated on OBSIDIAN_TC_ACL_AUDIT, which
    # nothing set. This job is the first thing that ever sets it in strict mode.
    #
    # Deliberately NOT folded into build-test: that matrix's module-harness tests
    # (test/m{1..6}-helpers.ts) build their ToolRegistry with no `rootResolver`, so the central
    # pathAcl stage in registry.ts (`const root = this.rootResolver?.(effVault); if (root) { ...
    # def.pathAcl(...) }`) never runs and the extractors never execute there -- running strict
    # mode over that suite would not test the extractors at all. The seven files below are the
    # ones that DO wire a real rootResolver (grep for it if that set needs to grow), so this is
    # the real dispatch path: central pathAcl stage + handler inside one runAudited frame.
    #
    # It found a real gap, and it's a documented carve-out, not a fix here. get_attachment
    # (include_references) / delete_attachment / list_attachments (include_reference_count) all
    # call findAttachmentReferences (src/formats/attachments.ts), which walks the whole vault and
    # reads every note's content with no per-note ACL check -- so the audit correctly flags
    # resolved paths the central pathAcl stage never checked. But unlike an unfiltered leak, every
    # one of those three call sites filters its output through readableRel(ctx.acl, p) before
    # returning it (attachment-tools.ts's N-2 comment), so no out-of-ACL path is ever observable
    # by the caller -- the same shape as the pre-existing CROSS_NOTE_REWRITE_TOOLS carve-out for
    # move_note/move_attachment/bulk_move_notes, just for reads instead of rewrites. They're
    # exempted via the separate CROSS_NOTE_READ_TOOLS set in acl-audit.ts (kept distinct from the
    # rewrite set because the safety argument differs: a rewrite tool returns nothing to leak
    # through, a read tool's safety depends entirely on that filtering staying intact). That
    # invariant is pinned by test/attachment-tools-branch-coverage.test.ts's "reference discovery
    # is ACL-filtered (THE-607)" suite, which asserts a referencing note outside the caller's read
    # ACL never appears in `references` or `reference_count` -- each of its three assertions was
    # confirmed to fail red when the corresponding `.filter(...)` was temporarily removed. This
    # job is intentionally not (yet) a required status check, the same way `perf` isn't -- promote
    # it once it has run green for a while.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/setup-repo
        with:
          node-required: 'true'
      - name: ACL extractor audit, strict mode, real dispatch surface (THE-607)
        run: bun run test:acl-audit
        working-directory: packages/server

  perf:
    runs-on: ubuntu-latest
    # THE-503: the motivating incident was a perf run overlapping the Vitest suite -- index/embed
    # throughput read ~51% below baseline and dispatch p99 was 16ms vs an isolated 1ms, and the
    # gate still passed (latency is warn-only). A workflow-level `concurrency:` group only
    # deduplicates runs of the SAME workflow on the SAME ref; it does not stop `perf` racing
    # `build-test`'s Vitest suite within one workflow run, nor two perf runs on different
    # refs/PRs racing each other on shared runner capacity. This job-level group is intentionally
    # NOT ref-scoped (unlike the workflow-level one above) so at most one `perf` job runs anywhere
    # in the repo at a time; `cancel-in-progress: false` because canceling one mid-measurement
    # would still leave a half-written artifact rather than just queuing the newer run.
    #
    # THE-592: `cancel-in-progress: false` only protects a job that is already RUNNING. It says
    # nothing about a job that is merely QUEUED -- and GitHub keeps only the newest PENDING request
    # per concurrency group, silently cancelling every older pending one. With N PRs open at once,
    # N-2 of them lose their perf run entirely rather than waiting their turn, and because `perf`
    # is not one of the 19 required checks, a CANCELLED run reads as "completed" on the PR and
    # merges with no perf verdict at all. Observed live: PR #485's perf job was cancelled this way,
    # and the very next run caught a real +39% `storage.bytes` regression that would otherwise have
    # merged silently. Per-PR perf has also mostly been warn-class in practice, and this dev host
    # cannot produce trustworthy numbers to begin with (calibration CV 0.822 against a 0.2
    # threshold) -- see `perf-baseline.yml`, already `workflow_dispatch`-only for the same reason.
    #
    # So `perf` now runs on push-to-main ONLY (the `if:` below), never on `pull_request`. A
    # post-merge run can still catch a regression before it compounds, and it can never be
    # cancelled by a sibling PR's perf run the way a pending PR check could be -- `main` only
    # advances one commit at a time, so there is no second push racing this one into the same
    # `perf-exclusive` group. The concurrency group above stays: it still protects a merge-triggered
    # run from overlapping anything else on the runner that also measures timing (e.g. a manual
    # `perf-baseline.yml` dispatch), which is the part of THE-503's finding this ticket does not
    # touch. A failed post-merge run is made visible via the issue step at the end of this job
    # (see its comment) -- a red run nobody looks at would be no better than a cancelled one.
    if: github.event_name == 'push'
    permissions:
      contents: read
      issues: write # THE-592: only this job needs it, for the post-merge-failure issue below
    concurrency:
      group: perf-exclusive
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - name: cache bun install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: install (native build for sqlite-vec)
        run: bun install --frozen-lockfile
      - name: perf gate (isolated - 5 fresh-subprocess samples, gated on the median; THE-503)
        run: bun run perf:gate:isolated
        working-directory: packages/server
      # THE-581: the densification scenario, gated for real. Its metrics existed from #452 and its
      # baseline from #456, but nothing compared them until this step — coverage that gates nothing
      # is the weaker half of the bug THE-581 closed.
      #
      # A SEPARATE step, not a second scenario folded into the one above, so a densification
      # regression names itself in the job log instead of arriving as "perf gate failed". Runs in
      # the same job to inherit the perf-exclusive concurrency group: densification is measured in
      # vec0 KNN call counts and wall time, and a run racing another perf job is exactly the
      # contention THE-503 exists to keep out of these numbers.
      #
      # Gated hard despite kNN edges being default-off in production. The point is
      # measurement integrity: the counts are deterministic, so this cannot flake, and a
      # deliberate change to densification is supposed to require a deliberate re-record.
      - name: perf gate - densification (family 15; THE-581)
        run: bun run perf:gate:densify:isolated
        working-directory: packages/server
      - name: upload perf report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-report
          # Both reports: the densify run writes its own file, and dropping it would leave a failed
          # densification gate with no artifact to inspect.
          path: |
            packages/server/perf-report.json
            packages/server/perf-report-densify.json
      # THE-494: Node portability run. Informational ONLY and deliberately never gated -- under
      # Node + node:sqlite the sqlite-vec extension does not load and vector search degrades to
      # brute force, so gating here would benchmark a path production never takes. It reports only
      # the metrics tagged `portable` at their source (deterministic + storage-agnostic); the
      # runner itself refuses --gate/--update-baseline under this profile.
      #
      # continue-on-error is on the STEP, not the job: a job-level setting does not survive a
      # failed step -- every later step is SKIPPED -- which would silently drop the upload below.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v5
        with:
          node-version: '24'
      - name: node portability run (informational, never gated; THE-494)
        continue-on-error: true
        run: bun run perf:node-parity
        working-directory: packages/server
      - name: upload node parity report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-node-parity
          path: packages/server/perf-node-parity.json
          if-no-files-found: warn
      # THE-592: post-merge visibility. `perf` now runs only on push-to-main (see the `if:` on this
      # job) and is not a required check, so without this a red run just sits on the Actions tab --
      # GitHub's default per-user email notification is the only other signal, and it is easy to
      # have muted or misconfigured. One ROLLING issue (like ci-prose-suggest.yml's advisory
      # narrative-drift issue) rather than one per failing run, for the same reason that one is
      # rolling: a fresh issue per push would become a notification firehose that gets muted --
      # and therefore useless -- within a week.
      - name: file or update a tracking issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="perf: post-merge gate failed on main"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          BODY_FILE=/tmp/perf-failure-issue-body.md
          {
            echo "The post-merge \`perf\` job failed against ${SHA}."
            echo
            echo "This job is not a required check (perf runs merge-only per THE-592, and this dev"
            echo "host cannot produce gate-quality numbers to require it against), so nothing else"
            echo "blocked the merge — this issue is the signal that a regression may have landed."
            echo
            echo "Run: ${RUN_URL}"
            echo
            echo "Download the \`perf-report\` / \`perf-report-densify\` artifacts from that run to"
            echo "see which metric failed, then decide: revert, fix forward, or (if the baseline"
            echo "itself is now stale) re-record it via \`perf-baseline.yml\`."
          } > "$BODY_FILE"

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file "$BODY_FILE"
            echo "Commented on existing issue #$EXISTING"
          else
            gh issue create --title "$TITLE" --body-file "$BODY_FILE"
          fi

name: cla

# The 40 Thieves Contributor License Agreement (CLA.md). A contributor signs once by posting the
# sign comment on a pull request; the signature is committed to the `cla-signatures` branch, which
# is the record. The DCO sign-off (dco.yml) still applies on top: the DCO certifies where the code
# came from, the CLA grants the licence to it.
#
# pull_request_target and issue_comment run with this repository's token, so this workflow never
# checks out or runs pull request code: the action only reads PR metadata and comments.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write # commit signatures to the cla-signatures branch
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read The 40 Thieves Contributor License Agreement and I hereby sign it.'))
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/The-40-Thieves/reliquary-tc/blob/main/CLA.md
          branch: cla-signatures
          # The maintainer is the grantee; Claude is the maintainer's agent on this repo; the named
          # bots only bump dependencies or run workflows. Bots are listed by name, never `*[bot]`:
          # anyone can create a GitHub App, so a wildcard would let any app-authored PR skip the CLA.
          # Entries are compared to the committer's login exactly (case-sensitive): Claude's is `claude`.
          allowlist: suavecito585,claude,dependabot[bot],renovate[bot],github-actions[bot],codspeed[bot]
          custom-pr-sign-comment: I have read The 40 Thieves Contributor License Agreement and I hereby sign it.
          custom-notsigned-prcomment: >-
            Thank you for your contribution. Before it can be merged, please read
            [The 40 Thieves Contributor License Agreement](https://github.com/The-40-Thieves/reliquary-tc/blob/main/CLA.md)
            and sign it by posting the comment below on this pull request. You only sign once.
            If you contribute for an employer, they also need the
            [Corporate CLA](https://github.com/The-40-Thieves/reliquary-tc/blob/main/CLA-CORPORATE.md).
          custom-allsigned-prcomment: All contributors have signed The 40 Thieves Contributor License Agreement.
          # Locking a merged PR keeps its sign comment from being edited or deleted afterwards.
          lock-pullrequest-aftermerge: true

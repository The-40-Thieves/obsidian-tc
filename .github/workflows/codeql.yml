name: CodeQL
on:
  pull_request:
    branches: [main]
  # Merge queue: GitHub's default CodeQL setup cannot run on merge_group, so the four required
  # `Analyze (...)` checks never reported on a queue entry. This advanced setup replaces it.
  # See CONTRIBUTING.md "Merge queue".
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'  # weekly: new queries and bundles against a static tree

# Least privilege. The job re-declares what it needs; the workflow default grants nothing extra.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    # The job name reproduces the check contexts default setup produced, which branch protection
    # requires: `Analyze (actions)`, `Analyze (javascript-typescript)`, `Analyze (python)`,
    # `Analyze (rust)`. Renaming the job or a matrix entry strands a required check; the required
    # `CodeQL` context is the code-scanning results check GitHub creates when a SARIF upload lands.
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      security-events: write  # upload SARIF
      contents: read
      actions: read  # read workflow run info (private-repo parity; required by the actions language)
    strategy:
      fail-fast: false
      matrix:
        # `none` build mode for every language: all four extract without a build.
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: rust
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # No `queries:` input: the default query suite, same as default setup (code-scanning/default-setup
          # reported query_suite "default").
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}

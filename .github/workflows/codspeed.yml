# CodSpeed continuous benchmarking.
#
# Three suites. The first two use CodSpeed's CPU simulation instrument (instruction counts under
# Valgrind, so results do not depend on how busy the GitHub-hosted runner is — the problem the
# `perf` gate and perf-baseline.yml have to work around with contention detection):
#
#   rust  — packages/native/benches/*.rs (Criterion via codspeed-criterion-compat): the shipped
#           cosine_batch / tokenize / bm25_score / rouge_l_lcs kernels.
#   node  — packages/server/bench/*.bench.ts (vitest 5 + @codspeed/vitest-plugin): note parsing,
#           chunking, link/tag extraction, link resolution, Bases filters and the JS retrieval
#           fallbacks, minus whatever packages/server/bench/instruments.ts routes to Walltime.
#
#   node-walltime — exactly the files instruments.ts routes away from Simulation, because
#           Simulation measured them bimodally for reasons outside the code (that file carries the
#           evidence). Walltime takes a distribution rather than one Valgrind pass, so a stray
#           pause lands in the spread instead of in the headline number.
#
#           It needs a CodSpeed macro runner. CodSpeed's own docs say Walltime on a shared
#           GitHub-hosted runner produces inconsistent data, and a Walltime baseline is only
#           comparable to runs on the same class of machine. So the job is gated on the repository
#           variable CODSPEED_MACRO_RUNNERS and stays SKIPPED - not queued forever against a label
#           nothing answers - until macro runners exist for this org. To enable: Organization
#           Settings -> Actions -> Runner groups -> Default -> allow public repositories (GitHub
#           blocks self-hosted runners on public repos by default), then
#           `gh variable set CODSPEED_MACRO_RUNNERS --body true`. Until then those files are
#           measured by neither suite, which is deliberate: being unmeasured beats a published
#           number that swings 29% on unrelated changes.
#
#           The runner is the arm64 Graviton one for two reasons. Cost: every CodSpeed plan
#           includes 600 free minutes per month of it, where the x64 Ryzen 9950X runner has no
#           free allowance, is Pro-with-contact-us, and bills at $0.06/min. Fidelity: this repo
#           ships an aarch64 binary and production runs Ampere, so arm64 is the closer match.
#           Walltime only requires that the label stay FIXED across runs - switching machine
#           class shifts the measurements and invalidates the baseline.
#
# Results are uploaded with OIDC (`id-token: write`), so no CODSPEED_TOKEN secret is needed.
# `workflow_dispatch` lets CodSpeed trigger backtest runs to build initial history.
name: codspeed

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: benchmarks (rust)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: packages/native
      - uses: taiki-e/install-action@ed67fa35ac944f3a9b33f12c4dd43b6f31a47e20 # v2
        with:
          tool: cargo-codspeed
      - name: build benchmarks
        working-directory: packages/native
        run: cargo codspeed build -m simulation
      - name: run benchmarks
        uses: CodSpeedHQ/action@78102a468f96d8e0ccb92d0ec49425753fc42062 # v5.6.0
        with:
          mode: simulation
          working-directory: packages/native
          run: cargo codspeed run

  node:
    name: benchmarks (node)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-repo
        with:
          node-required: 'true'
      - name: run benchmarks
        uses: CodSpeedHQ/action@78102a468f96d8e0ccb92d0ec49425753fc42062 # v5.6.0
        with:
          mode: simulation
          working-directory: packages/server
          run: bun run bench

  node-walltime:
    name: benchmarks (node, walltime)
    # A missing variable is falsy, so the default is skip. See the header for how to turn it on.
    if: vars.CODSPEED_MACRO_RUNNERS == 'true'
    runs-on: codspeed-macro-arm64-graviton-ubuntu-22-04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-repo
        with:
          node-required: 'true'
          # A macro runner is a different machine class from ubuntu-latest, so it must not share
          # the simulation job's bun install cache entry.
          cache-key-suffix: macro-${{ runner.arch }}
      - name: run benchmarks
        uses: CodSpeedHQ/action@78102a468f96d8e0ccb92d0ec49425753fc42062 # v5.6.0
        with:
          mode: walltime
          working-directory: packages/server
          run: bun run bench:walltime

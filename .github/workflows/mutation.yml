# StrykerJS mutation score for packages/shared's three pure parsers, on Stryker's COMMAND runner
# (`testRunner: "command"`, running the whole shared vitest suite per mutant). The scope and the
# config live in packages/shared/stryker.config.mjs; this file only schedules the run and keeps its
# report.
#
# WHY THE COMMAND RUNNER. Under Vitest 5, @stryker-mutator/vitest-runner 10.0.0 runs none of a
# mutant's covering tests and reports it Survived (upstream: https://github.com/stryker-mutator/stryker-js/issues/6210). On src/fetch-cause.ts
# alone that gave 4 killed / 22 survived; the command runner gives 25 killed / 1 survived. The
# config comment has the detail.
#
# WHY NIGHTLY AND NON-GATING. The score is a signal to read, not a verdict: thresholds.break is null.
# A run takes about 21 minutes, too slow for every PR, and a required check that slow would be
# flaky by construction. Nothing here triggers on pull_request or merge_group, so it is not a required
# check and cannot block a merge.
#
# MEASURED LOCALLY before wiring (Node v26.10.0, Stryker 10.0.0, vitest 5.0.5): 846 mutants in 3 files,
# score 80.02% (675 killed, 2 timeout, 169 survived), `bun run mutate` exit 0 in 21 min 23 s wall.
# The report lands in packages/shared/reports/mutation/.
#
# WHY workflow_dispatch TOO. A maintainer can re-run it on demand without waiting for the schedule.
name: mutation

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-repo
        with:
          node-required: "true"
      - name: mutation run (non-gating; the score is read from the report, not enforced)
        working-directory: packages/shared
        run: bun run mutate
      - name: upload the mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report-${{ github.run_id }}
          path: packages/shared/reports/mutation/
          if-no-files-found: warn
          retention-days: 30

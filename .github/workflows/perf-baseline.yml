# THE-534: record the perf baseline ON THE CI RUNNER, which is the decided reference host.
#
# WHY THIS EXISTS AT ALL. The baseline is the reference the `perf` gate compares against, so it has
# to be measured somewhere reproducible. A developer box is not that: the dev host this project is
# built on sits at load ~7 on 4 cores with 43 containers, and the harness correctly REFUSES to record
# there (calibration CV 0.822 against a 0.2 threshold). Rather than weaken the refusal, the reference
# moves to the machine the gate already runs on.
#
# WHY IT UPLOADS AN ARTIFACT RATHER THAN PUSHING. eval/perf/README.md: "Baseline changes must be
# manually committed and justified in the PR. The baseline is drift-safe because you hand-commit it,
# not because it auto-updates." Recording moves to CI; REVIEW does not. A silently self-updating
# baseline would ratchet a regression in one green run at a time, which is the precise failure
# THE-534 exists to prevent.
#
# This job therefore hands back a FILE, and a human commits it. It used to hand back a pushed branch
# and try to open a PR on top, which failed on every run: "Allow GitHub Actions to create and approve
# pull requests" is an org-level setting that is off, and `permissions: pull-requests: write` cannot
# override it (the repo-level API returns 409 — "prevented by the owning organization"). The job
# degraded to a notice and left the branch behind. Nothing ever collected them: five orphan
# `perf-baseline/small-*` branches accumulated on 2026-08-07 and were deleted unmerged on 08-08.
#
# An artifact is the same deliverable without the litter — no org setting to change, no PAT to
# rotate (THE-574), and `contents: read` is now sufficient because nothing is pushed.
#
# It also retains MORE than the branch did. `perf-report.json` carries the raw per-sample series;
# the committed `baseline.*.json` keeps only aggregates. On 2026-08-08 the raw samples were needed
# to show that `storage.txn_ms` / `storage.cpu_ms` are bimodal rather than noisy, and the only
# surviving copy was in the Actions run logs, which expire. Ship the report with the baseline.
#
# WHY workflow_dispatch ONLY. Re-baselining is a deliberate act taken when the system has changed on
# purpose. On a schedule or on push it would quietly absorb drift.
name: perf-baseline

on:
  workflow_dispatch:
    inputs:
      scenario:
        # THE-581: `densify` is here because a scenario with no committed baseline is coverage that
        # gates nothing — the collector runs, the numbers are real, and nothing compares them. It is
        # the ONLY route to that baseline: the harness refuses to record on the dev host (calibration
        # CV 0.822 against a 0.2 threshold), which is exactly the refusal this workflow exists to
        # respect rather than weaken.
        description: 'Scenario to baseline (the gate uses "small"; "densify" is THE-581 family 15)'
        required: false
        default: small
        type: choice
        options: [small, densify, vault1k, medium, large]
      samples:
        description: "Isolated samples to take the median of (>= 5 recommended)"
        required: false
        default: "5"
        type: string

# Nothing is pushed and no PR is opened, so the token needs no write anywhere. Dropped from
# `contents: write` + `pull-requests: write` when the branch push became an artifact upload —
# uploading an artifact needs no `permissions:` grant at all.
permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    # MUST match the `perf` gate's runner class in ci-server.yml. A reference measured on a different
    # machine than the one doing the comparing is not a reference, it is a second opinion.
    #
    # Same concurrency group as that gate, deliberately: a recording run and a gate run on the same
    # shared capacity would contend, and while the contention detector would likely catch it and
    # refuse, serializing means it never has to.
    concurrency:
      group: perf-exclusive
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - name: cache bun install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: install (native build for sqlite-vec)
        run: bun install --frozen-lockfile

      # No continue-on-error: a REFUSED recording (host contention detected) must fail the job and
      # publish nothing. Recording a contended baseline is worse than not recording one -- it looks
      # authoritative and gets cited in a go/no-go. The refusal is I/O-driven in practice: across 9
      # dispatches every refusal was the io channel, and one ISOLATED run still hit io CV 1.791
      # against a 0.45 threshold, so a clean runner is likely but never guaranteed. Re-dispatch.
      - name: record baseline (isolated, median of N fresh subprocesses)
        # Inputs go through env, never interpolated into the shell. `scenario` is a `choice` so it is
        # already constrained to the enum, but `samples` is free-form: dispatching needs write access,
        # yet "the attacker already had write access" is not a reason to hand them a shell. `samples`
        # is additionally validated as digits before use.
        env:
          SCENARIO: ${{ inputs.scenario }}
          SAMPLES: ${{ inputs.samples }}
        run: |
          set -euo pipefail
          case "$SAMPLES" in
            ''|*[!0-9]*) echo "::error title=Invalid samples::must be a positive integer, got '$SAMPLES'"; exit 1 ;;
          esac
          bun eval/perf/run.ts \
            --scenario "$SCENARIO" \
            --samples "$SAMPLES" \
            --out perf-report.json \
            --update-baseline
        working-directory: packages/server

      - name: collect the recording
        env:
          SCENARIO: ${{ inputs.scenario }}
          SAMPLES: ${{ inputs.samples }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/perf-baseline"
          mkdir -p "$OUT"

          # The baseline is the deliverable and must exist: the record step carries no
          # `continue-on-error`, so if it is missing the recording did not produce what we think it
          # did, and that is a failure rather than an empty upload.
          BASELINE="packages/server/eval/perf/baseline.${SCENARIO}.json"
          cp "$BASELINE" "$OUT/"

          # perf-report.json is the one that carries the RAW per-sample series; the committed
          # baseline keeps only aggregates, and aggregates cannot distinguish a noisy metric from a
          # bimodal one. The other two are the quiet-host calibration median used for
          # sustained-contention detection, and THE-534's provenance sidecar.
          for extra in \
            "packages/server/perf-report.json" \
            "packages/server/eval/perf/calibration-reference.json" \
            "packages/server/eval/perf/baseline.${SCENARIO}.provenance.json"; do
            if [ -f "$extra" ]; then cp "$extra" "$OUT/"; fi
          done

          # Diff the BASELINE ALONE, not the whole file set. The provenance sidecar stamps
          # `measuredAt` on every run, so any list containing it is never quiet — the old
          # "no baseline change" branch included it and could therefore never be taken.
          if git diff --quiet -- "$BASELINE"; then
            VERDICT="unchanged — the recorded numbers match the committed baseline"
          else
            VERDICT="CHANGED — review the direction of every metric before committing"
          fi

          {
            echo "## perf baseline — \`${SCENARIO}\`"
            echo
            echo "- Median of **${SAMPLES}** fresh-subprocess samples on \`ubuntu-latest\`, the runner class the \`perf\` gate compares on (THE-534)."
            echo "- Measured against \`${GITHUB_SHA}\`."
            echo "- Host contention was NOT detected — the harness refuses to record under it, so this artifact existing is that evidence."
            echo "- Baseline vs committed: **${VERDICT}**."
            echo
            echo "### To land it"
            echo
            echo "Download the artifact, copy the files over \`packages/server/eval/perf/\`, and open a PR."
            echo "**A number that moved the worse way is a regression being accepted into the reference** and needs a reason in that PR."
            echo "\`baseline.${SCENARIO}.provenance.json\` records the SHA, sample count and host shape it was taken on."
            echo
            echo "\`perf-report.json\` holds the raw per-sample series. It is not committed — keep it with any"
            echo "analysis that cites it, because the run log it would otherwise live in expires."
          } >> "$GITHUB_STEP_SUMMARY"

      # Retention is set explicitly rather than left to the repo default: this artifact exists
      # precisely because the run log that used to hold the raw samples ages out, so the window it
      # survives is part of the design. 90 is the ceiling for public repos.
      - name: upload the recording
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-baseline-${{ inputs.scenario }}-${{ github.run_id }}
          path: ${{ runner.temp }}/perf-baseline
          if-no-files-found: error
          retention-days: 90

name: publish
on:
  push:
    tags: ['v*']
  # THE-542: three of the eight native targets (aarch64-unknown-linux-gnu, x86_64-apple-darwin,
  # aarch64-pc-windows-msvc) are built ONLY here, so nothing on a PR ever proves they compile — the
  # first time anyone finds out is mid-release. Do NOT "just push a throwaway tag" to test: the push
  # trigger above matches any v*, the preflight only checks that the version is UNpublished, so a
  # v0.0.0-test tag would pass and really publish obsidian-tc + all 8 platform sub-packages to npm
  # (immutable, unrevocable) and push a ghcr image. This dispatch builds the same 8-target matrix and
  # publishes nothing.
  #   gh workflow run publish.yml --ref <branch> -f dry_run=true
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build the 8 native targets only; publish nothing.'
        type: boolean
        default: true

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

# M7 (THE-183) shipped a 4-platform native matrix with linux-arm64 deferred (G3 amendment,
# THE-141); it is now an 8-platform matrix — linux/darwin/win each x64 + arm64, plus linux x64 +
# arm64 musl. linux-arm64-gnu cross-compiles on the x64 ubuntu runner (gcc-aarch64-linux-gnu step
# below); win-arm64 via the bundled MSVC ARM64 tools; the two musl targets via `napi build -x`
# (cargo-zigbuild + setup-zig, gated to the musl rows). CycloneDX SBOMs
# generated per package below (THE-299, non-blocking); cosign still deferred; text bun.lock. Fires only on a
# human-pushed v* tag — it is config-verified here, not executed. R5/THE-214: the sub-packages
# now publish under the owned @the-40-thieves scope (obsidian-tc-shared / obsidian-tc-native);
# the server stays the owned unscoped obsidian-tc. The pin-workspace-deps step below rewrites
# workspace:* to concrete versions (npm publish does not), so the published obsidian-tc carries
# real dep versions. The npm-publish jobs still require the NPM_TOKEN secret before a tag.
jobs:
  # THE-528: the v* tag triggers this entire release — ghcr image, npm publishes, SBOMs and
  # provenance all hang off it — so it is the one input nothing currently authenticates. Actions
  # are SHA-pinned, the scanner is digest-pinned and packages carry provenance; an unsigned trigger
  # is the weakest link in that chain.
  #
  # Report-only until a maintainer key is committed to .github/allowed_signers: enforcing before a
  # key exists would fail the next release with no warning. Set REQUIRE_SIGNED_TAG to "true" to
  # enforce. Setup runbook: docs/RELEASE-SIGNING.md
  verify-tag:
    runs-on: ubuntu-latest
    env:
      REQUIRE_SIGNED_TAG: "true"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0 # tag objects + their signatures are not in a shallow clone
      - name: verify the release tag is signed
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          # A workflow_dispatch dry run targets a BRANCH, not a tag — there is no tag object to
          # verify and github.ref_name is the branch name. Now that build-native needs this job,
          # enforcing here would break every dry run the moment REQUIRE_SIGNED_TAG flips to true,
          # which is precisely the 8-target rehearsal that must keep working.
          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "ref_type is '${{ github.ref_type }}', not a tag — nothing to verify (dry run)."
            exit 0
          fi
          if [ ! -f .github/allowed_signers ]; then
            echo "::warning title=Release tag not verified::No .github/allowed_signers committed, so the signature on '$TAG' cannot be checked. See docs/RELEASE-SIGNING.md."
            if [ "$REQUIRE_SIGNED_TAG" = "true" ]; then
              echo "REQUIRE_SIGNED_TAG=true but no allowed_signers file exists — refusing to release."
              exit 1
            fi
            exit 0
          fi
          # A lightweight tag is a bare commit ref with no object to carry a signature.
          if [ "$(git cat-file -t "$TAG")" != "tag" ]; then
            echo "::warning title=Lightweight tag::'$TAG' is not an annotated tag, so it cannot be signed. Use 'git tag -s'."
            [ "$REQUIRE_SIGNED_TAG" = "true" ] && exit 1
            exit 0
          fi
          if git -c gpg.ssh.allowedSignersFile=.github/allowed_signers verify-tag "$TAG"; then
            echo "Tag '$TAG' carries a valid signature from an allowed signer."
          else
            echo "::warning title=Unsigned or unverifiable tag::'$TAG' did not verify against .github/allowed_signers."
            [ "$REQUIRE_SIGNED_TAG" = "true" ] && exit 1
          fi
          exit 0

  build-native:
    # THE-528: gate the entire release on the tag check. Without this `needs:`, verify-tag was an
    # island — nothing depended on it, so it ran in parallel and a FAILING signature check could not
    # stop anything. build-native is the root of the DAG (publish-npm needs it, and everything else
    # needs publish-npm), so one edge here is what makes the check load-bearing rather than
    # decorative. A gate that cannot block is worse than no gate, because it is trusted.
    needs: verify-tag
    strategy:
      fail-fast: true
      matrix:
        include:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            triple: linux-x64-gnu
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            triple: linux-arm64-gnu
          - host: macos-latest
            target: x86_64-apple-darwin
            triple: darwin-x64
          - host: macos-14
            target: aarch64-apple-darwin
            triple: darwin-arm64
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            triple: win32-x64-msvc
          - host: windows-latest
            target: aarch64-pc-windows-msvc
            triple: win32-arm64-msvc
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            triple: linux-x64-musl
          - host: ubuntu-latest
            target: aarch64-unknown-linux-musl
            triple: linux-arm64-musl
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # THE-542: every OTHER call site sets this; without it the release job caches the repo root
          # instead of the crate, so the one build that matters most runs permanently cold.
          workspaces: packages/native
      - run: bun install --frozen-lockfile
      # musl targets cross-compile via napi's `-x` (cargo-zigbuild); zig is the linker. Gated to
      # the two musl rows only — the gnu / darwin / win rows are untouched.
      - name: install zig for musl cross-compile
        if: endsWith(matrix.target, '-musl')
        uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2
        with:
          version: 0.13.0
      # THE-542: ci-native's musl-cross-build job pre-installs cargo-zigbuild explicitly, but this job
      # relied on napi auto-installing it on first use — so the musl path CI validates and the musl
      # path a release actually takes were not the same path. Compiling cargo-zigbuild from source
      # inside a release, on a target no PR can reach, is where you least want a surprise.
      - name: install cargo-zigbuild for musl cross-compile
        if: endsWith(matrix.target, '-musl')
        uses: taiki-e/install-action@ed67fa35ac944f3a9b33f12c4dd43b6f31a47e20 # v2
        with:
          tool: cargo-zigbuild
      # linux-arm64 is cross-compiled on the x64 ubuntu runner, which has no aarch64 linker
      # by default. Install the GNU cross toolchain and point cargo's linker (and the cc
      # crate, for when the commented-out sqlite-vec/ndarray deps land) at it. The other five
      # targets need no extra step: darwin clang cross-compiles x64<->arm64, and the x64
      # windows runner ships the MSVC ARM64 tools, so napi builds them with just the rust target.
      - name: install aarch64 linux cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          {
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
            echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++"
          } >> "$GITHUB_ENV"
        shell: bash
      - name: build native (.node)
        working-directory: packages/native
        run: bun run build -- --target ${{ matrix.target }} ${{ endsWith(matrix.target, '-musl') && '-x' || '' }}
        shell: bash
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.triple }}
          path: packages/native/*.node
          if-no-files-found: error

  publish-npm:
    # THE-542 dry-run guard: on a workflow_dispatch with dry_run, everything downstream of
    # build-native is skipped so the 8-target matrix can be proven without shipping anything.
    # A real release is a tag push, where github.event_name == 'push' and this is always true.
    if: github.event_name == 'push' || !inputs.dry_run
    needs: build-native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: bun install --frozen-lockfile
      # `pattern` is load-bearing: with no filter this downloads EVERY artifact in the run, and
      # docker/build-push-action auto-uploads a build record (`<owner>~<repo>~XXXXXX.dockerbuild`)
      # that cannot be downloaded here — v1.12.1's publish died on it with
      # "Unable to download artifact(s): ... failed after 5 retries", twice, after all 20+ build
      # jobs had passed. This job consumes only the napi `.node` artifacts; the binaries, mcpb and
      # plugin bundles are draft-release's business. Filtering by what we NEED also stops any
      # future job's artifacts from breaking the publish the same way.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*
          path: packages/native/artifacts
      # napi artifacts only *fills* per-platform dirs; it does not create them.
      # create-npm-dirs generates npm/<triple>/ (scoped @the-40-thieves/obsidian-tc-native-<triple>)
      # from the napi config before the .node files are moved in.
      - name: create napi npm dirs (per-platform package dirs)
        working-directory: packages/native
        run: bunx napi create-npm-dirs
      - name: collect prebuilt .node files (napi)
        working-directory: packages/native
        run: bunx napi artifacts --output-dir artifacts
      # Build via working-directory (not --filter): the rename moved packages off the bare
      # names, so `--filter=shared|server` matched nothing. Mirrors the passing ci-* workflows.
      - name: build shared
        working-directory: packages/shared
        run: bun run build
      - name: build server
        working-directory: packages/server
        run: bun run build
      # npm publish does NOT rewrite the workspace: protocol, so pin workspace:* deps to concrete
      # versions before publishing — otherwise the published obsidian-tc would ship
      # "@the-40-thieves/obsidian-tc-shared": "workspace:*" and fail to install (THE-214).
      - name: pin workspace deps to concrete versions
        run: bun scripts/pin-workspace-deps.mjs
      # F3 preflight: npm publish is immutable and this job publishes 3 packages (+ napi
      # sub-packages) sequentially with no rollback. If any target version is already on npm,
      # fail BEFORE the first publish so a re-run cannot half-publish a version-skewed release.
      # (Checks the umbrella packages; platform sub-packages track the native version.)
      # THE-575: this used to fail unconditionally the moment ANY target version existed on npm,
      # which made a partially-failed release unrecoverable — npm versions are immutable, so the
      # publish could not be retried, and every downstream job gated on this one could never run.
      # v1.11.0 hit exactly that: the publishes succeeded, the dist-tag promote failed (THE-574),
      # and the image/binaries/bundle/release-notes became unreachable for that tag.
      #
      # It now CLASSIFIES instead of asserting, on the only distinction that is safe to draw:
      #
      #   none published  -> fresh release; publish normally.
      #   ALL published   -> a RESUMED release; skip the publish steps and let the rest of the
      #                      pipeline finish. Re-running the artifact jobs is idempotent (ghcr tags
      #                      are mutable, the GitHub release is a draft), so this is recoverable
      #                      rather than destructive.
      #   SOME published  -> genuinely ambiguous: either a release died mid-publish or someone
      #                      tagged without bumping. FAIL loudly. A human must look, because
      #                      guessing here is how a version-skewed half-release gets cemented.
      #
      # Note this does weaken the original "bump before tagging" guard: re-tagging an already-released
      # version now rebuilds its artifacts rather than erroring. That is a deliberate trade — the
      # failure it prevents (an unrecoverable release) is far more expensive than the one it allows
      # (a harmless artifact rebuild), and npm itself still refuses a duplicate publish regardless.
      - name: preflight — classify target versions (F3, THE-575)
        id: preflight
        run: |
          set -euo pipefail
          published=0
          missing=0
          check() {
            local dir="$1" name version
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "published: $name@$version"
              published=$((published + 1))
            else
              echo "unpublished: $name@$version"
              missing=$((missing + 1))
            fi
          }
          check packages/native
          check packages/shared
          check packages/server
          # platform sub-packages generated by napi create-npm-dirs (THE-224)
          for d in packages/native/npm/*/; do
            check "${d%/}"
          done

          echo "summary: $published published, $missing unpublished"
          if [ "$published" -gt 0 ] && [ "$missing" -gt 0 ]; then
            echo "::error::PARTIAL publish state — $published of $((published + missing)) target versions exist on npm."
            echo "::error::A release died mid-publish, or a tag was cut without bumping. npm versions are immutable:"
            echo "::error::inspect npm, then bump the version and re-tag. Orphaned sub-versions are harmless —"
            echo "::error::nothing references them, since the umbrella that pins them was never published."
            exit 1
          fi
          if [ "$missing" -eq 0 ]; then
            echo "::notice::All target versions are already published — treating this as a RESUMED release and skipping the publish steps."
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash
      # New scoped npm packages default to `restricted`, so the FIRST publish of the new musl
      # platform sub-packages died with `402 Payment Required` (must sign up for private packages).
      # Force every generated platform package public before napi publishes them: napi runs
      # `npm publish` per npm/<triple> dir and honors each dir's publishConfig.access.
      - name: make platform sub-packages public (npm 402 fix)
        if: steps.preflight.outputs.already_published != 'true'
        working-directory: packages/native
        shell: bash
        run: |
          set -euo pipefail
          for f in npm/*/package.json; do
            node -e 'const fs=require("fs");const f=process.argv[1];const p=JSON.parse(fs.readFileSync(f,"utf8"));p.publishConfig=Object.assign({},p.publishConfig,{access:"public"});fs.writeFileSync(f,JSON.stringify(p,null,2)+"\n");' "$f"
            echo "publishConfig.access=public -> $f"
          done
      # Platform sub-packages (one per built triple, @the-40-thieves/obsidian-tc-native-<triple>)
      # + the umbrella optionalDependencies are generated and published by `napi pre-publish`.
      - name: publish platform sub-packages (napi)
        if: steps.preflight.outputs.already_published != 'true'
        working-directory: packages/native
        run: bunx napi pre-publish -t npm --no-gh-release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # THE-574: publish straight to the release dist-tag, in dependency order, with the
      # user-facing `obsidian-tc` LAST. This replaces THE-224's publish-to-`pending`-then-promote
      # design, which cannot work under trusted publishing: OIDC authorises `npm publish` only, so
      # the `npm dist-tag add` promote fell back to token auth and failed EOTP on every release.
      #
      # Dropping `pending` costs no safety, because THE-224's actual property is preserved by two
      # facts rather than by the holding tag:
      #
      #   1. Every inter-package dependency is EXACT-pinned, never ranged. pin-workspace-deps.mjs
      #      rewrites workspace:* to the concrete version, so published obsidian-tc@X depends on
      #      exactly -native@X and -shared@X, and -native@X optionalDepends on exactly the eight
      #      -native-<triple>@X. Nothing resolves a sub-package through a dist-tag, so what `latest`
      #      points at on the sub-packages cannot affect any install, and no already-installed
      #      release can drift onto a half-published version.
      #   2. `obsidian-tc` publishes LAST. It is the only package installed by name, so its
      #      `latest` is the only one that matters. If the sequence dies before it, `npm install
      #      obsidian-tc` keeps resolving the previous release, wholly intact — exactly the property
      #      `pending` existed to provide.
      #
      # Prereleases go to `next`, never `latest`: bare `npm publish` defaults to `latest` regardless
      # of semver, which would otherwise drag the stable tag onto a prerelease.
      - name: publish umbrellas to the release dist-tag (obsidian-tc last)
        if: steps.preflight.outputs.already_published != 'true'
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/server/package.json').version")
          case "$version" in
            *-*) tag=next ;;
            *) tag=latest ;;
          esac
          echo "publishing $version to dist-tag: $tag"
          for dir in packages/native packages/shared packages/server; do
            name=$(node -p "require('./$dir/package.json').name")
            (cd "$dir" && npm publish --provenance --access public --tag "$tag")
            echo "published: $name@$version -> $tag"
          done
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # THE-299: CycloneDX SBOMs (npm >=9.5 built-in) uploaded as workflow artifacts beside the
      # npm provenance attestations. Non-blocking BY DESIGN: a release must not brick on SBOM
      # generation, but a skip is surfaced as an explicit workflow warning, never silently.
      - name: generate SBOMs (CycloneDX)
        run: |
          set -uo pipefail
          mkdir -p sboms
          for p in native shared server; do
            if ! (cd "packages/$p" && npm sbom --sbom-format cyclonedx) > "sboms/obsidian-tc-$p.cdx.json" 2>/dev/null; then
              echo "::warning::SBOM generation failed for packages/$p"
              rm -f "sboms/obsidian-tc-$p.cdx.json"
            fi
          done
          ls -la sboms/
        shell: bash
      - name: upload SBOM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sboms
          path: sboms/
          if-no-files-found: warn

  # THE-940: publish server.json to the official MCP Registry (registry.modelcontextprotocol.io).
  # THE-220 committed server.json to the repo root, but nothing ever published it — the registry
  # entry has been missing since. mcp-publisher's own ownership check reads the LIVE npm package
  # description (via the `mcpName` marker in packages/server/package.json, asserted equal to
  # server.json's `name` by ci-version.yml's check-mcp-name gate), so this job must run only after
  # every npm package server.json references is actually resolvable on npmjs — a publish attempted
  # before propagation 404s; see the propagation-wait step below. `if: github.event_name == 'push'`
  # (no `workflow_dispatch` path at all, unlike publish-npm's `|| !inputs.dry_run`) is deliberate
  # and stricter than every other job in this workflow: a dispatched dry run never has a real
  # npm-published version for the registry to point at, and the task brief that added this job is
  # explicit that it "must run only on v* tags" — `on.push.tags` already restricts
  # `github.event_name == 'push'` to exactly that.
  #
  # `needs: publish-npm` ONLY, not a list — review question, ruled by the controller: server.json's
  # `packages[]` today lists exactly one npm package (`obsidian-tc`), and `packages/reranker-local`
  # is deliberately NOT one of them — it is an optional add-on resolved at runtime (its own README),
  # not how the server is launched, so the registry validates nothing about it and no publish job
  # for it needs to feed into this one. If `server.json`'s `packages[]` ever DOES grow a second npm
  # entry (reranker-local or otherwise), add that package's publish job to this `needs:` list — the
  # propagation-wait step below already loops every `packages[]` npm entry (derived from
  # server.json, not hardcoded; review finding I3), so it needs no corresponding edit. See
  # RELEASING.md's "MCP Registry publish" section for the same note.
  publish-registry:
    if: github.event_name == 'push'
    needs: publish-npm
    runs-on: ubuntu-latest
    # Review finding M4: the comment here previously claimed this scopes the OIDC token's `sub`
    # claim — false. The registry's GitHub-OIDC handler
    # (internal/api/handlers/v0/auth/github_oidc.go) validates issuer, audience, and a non-empty
    # `repository_owner` claim; it never reads `sub`. What this environment DOES buy: a named,
    # empty-today surface (auto-created on first use — nothing to provision up front) that an owner
    # can later attach required-reviewer / ref-protection rules to. It changes nothing about the
    # OIDC exchange itself today.
    environment: mcp-registry
    # Job-scoped, narrower than the workflow-level block above: id-token mints the OIDC token
    # mcp-publisher exchanges for a short-lived registry credential (no stored PAT/secret — see
    # "GitHub OIDC (CI/CD)" in the registry's CLI docs). contents: read is only for checking out
    # server.json.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      # Review finding I1: mirrors publish-npm's F3 classification (`already_published`, checked
      # by every downstream step's `if:` below) so a re-run on a resumed release is clean rather
      # than red. Registry versions are IMMUTABLE — a second `mcp-publisher publish` at the same
      # name+version fails hard ("cannot publish duplicate version"; registry v1.8.1,
      # internal/database/database.go's ErrInvalidVersion) — so this has to be a real check against
      # the registry itself, not an optimistic retry. `GET /v0/servers/{name}/versions/{version}`
      # is the exact-match endpoint (200 = published, 404 = not) — deliberately NOT the `?search=`
      # endpoint RELEASING.md's confirmation step uses, which is fuzzy and can both over- and
      # under-match. A non-200/404 status (network error, registry outage, unexpected 5xx) fails
      # the job rather than guessing either way.
      - name: preflight — is this exact name+version already registered? (I1, resumed-release contract)
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          name=$(jq -r '.name' server.json)
          version=$(jq -r '.version' server.json)
          enc_name=$(jq -rn --arg n "$name" '$n|@uri')
          enc_version=$(jq -rn --arg v "$version" '$v|@uri')
          url="https://registry.modelcontextprotocol.io/v0/servers/$enc_name/versions/$enc_version"
          # G4 fix: --connect-timeout / --max-time bound how long a STALLED connection can hang
          # this step — without them, a connection that opens but never responds blocks until the
          # JOB's own timeout (default 6h), not until this step's own retry/backoff logic ever
          # gets a chance to run. A DNS/TCP failure that curl detects immediately was already
          # handled (this step aborts on purpose — see the comment above); this closes the gap
          # where curl does NOT fail immediately: a connection that hangs mid-request.
          status=$(curl -sS --connect-timeout 10 --max-time 20 -o /dev/null -w '%{http_code}' "$url")
          case "$status" in
            200)
              echo "$url -> 200: $name@$version is already registered — resumed release, skipping the publish steps (registry versions are immutable; a second publish would fail with 'cannot publish duplicate version')."
              echo "already_published=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "$url -> 404: $name@$version is not yet registered — proceeding to publish."
              echo "already_published=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::unexpected HTTP $status checking whether $name@$version is already registered ($url) — refusing to guess whether this is a resumed release; a registry outage or auth problem should fail loud here, not silently pick a side."
              exit 1
              ;;
          esac
      # Review findings I2 + I3: publish-npm already published every npm package server.json
      # references (dependency order — see RELEASING.md's "Ordered npm publish"), or the F3
      # preflight found them already published on a resumed release. Either way this is a
      # load-bearing wait, not decoration: registry.modelcontextprotocol.io validates package
      # ownership by fetching the exact npm VERSION document for each `packages[]` npm entry
      # (`<registryBaseUrl>/<identifier>/<version>` — e.g. https://registry.npmjs.org/obsidian-tc/1.25.0),
      # not the packument `npm view`/`GET /<name>` fetches. Those are separate CDN objects with
      # independent propagation — polling the packument (as an earlier version of this job did) can
      # go green while the version document a moment later still 404s. This polls the SAME url the
      # registry itself builds, derived from server.json rather than hardcoded (I3), and loops
      # every npm entry in `packages[]` (today: just `obsidian-tc`; see the `needs:` comment above
      # for what changes if a second one is ever added).
      - name: wait for every npm package in server.json to resolve at its exact version
        if: steps.preflight.outputs.already_published != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t rows < <(jq -c '.packages[] | select(.registryType == "npm")' server.json)
          if [ "${#rows[@]}" -eq 0 ]; then
            echo "::error::server.json has no npm packages[] entries — nothing to wait for, which is unexpected for this repo."
            exit 1
          fi
          for row in "${rows[@]}"; do
            identifier=$(jq -r '.identifier' <<<"$row")
            version=$(jq -r '.version' <<<"$row")
            # N4 fix: registryBaseUrl is OPTIONAL in the registry schema (npm.go defaults it
            # server-side when absent) — `.registryBaseUrl // "..."` mirrors that default here, so
            # a future packages[] entry that omits it gets the real npm registry URL instead of the
            # literal string "null" (jq -r's rendering of a JSON null) baked into $url.
            base=$(jq -r '.registryBaseUrl // "https://registry.npmjs.org"' <<<"$row")
            # G1 fix: jq's `@uri` percent-encodes EVERY reserved character per RFC 3986,
            # including `@` — so a scoped npm identifier ("@the-40-thieves/obsidian-tc-shared")
            # became "%40the-40-thieves%2Fobsidian-tc-shared". That is not what the registry
            # itself sends: its own npm validator builds the URL with Go's `url.PathEscape`,
            # which leaves `@` literal (it is a valid `pchar` — RFC 3986 allows `@` unescaped
            # in a path segment) and escapes only `/` (the one character that would otherwise
            # be read as a path separator, splitting a scoped identifier into two segments).
            # Encode ONLY the slash, matching that exactly — an npm package name cannot
            # contain any other character `url.PathEscape` would touch.
            enc_id=$(jq -rn --arg n "$identifier" '$n | gsub("/";"%2F")')
            url="$base/$enc_id/$version"
            echo "waiting for $identifier@$version to resolve at $url (the exact document the registry itself fetches to validate npm ownership)..."
            resolved=false
            for i in $(seq 1 10); do
              # N1 fix: `|| status="000"` is load-bearing under `set -euo pipefail` — without
              # it, a DNS or TCP blip on curl itself (not an HTTP error, a connection failure —
              # exit 6, "Could not resolve host") aborts this whole step immediately, so the
              # ten-attempt retry loop whose entire purpose is tolerating exactly that never runs a
              # second time. The fallback is on the ASSIGNMENT, not inside the command
              # substitution (`|| echo 000` there would double up with curl's own `-w` output,
              # which already prints a literal "000" on a connection-level failure before exiting
              # non-zero — measured: that shape yields the string "000000", not "000"). `000` is
              # not a real HTTP status, so it always falls through to the "retry in 10s" branch
              # below rather than being mistaken for success.
              # G4 fix: same --connect-timeout/--max-time bound as the preflight curl above — a
              # stalled connection (not a fast DNS/TCP failure, which the `|| status="000"`
              # fallback already covers) would otherwise hang this attempt indefinitely instead of
              # counting as one of the ten and moving on to the next.
              status=$(curl -sS --connect-timeout 10 --max-time 20 -o /dev/null -w '%{http_code}' "$url") || status="000"
              if [ "$status" = "200" ]; then
                echo "  attempt $i: $url -> 200, resolved"
                resolved=true
                break
              fi
              echo "  attempt $i: $url -> $status, retrying in 10s..."
              sleep 10
            done
            if [ "$resolved" != "true" ]; then
              echo "::error::$identifier@$version never resolved at $url after 10 attempts (this is the exact npm version-document endpoint the registry itself fetches, not the packument) — refusing to publish, which would 404 on this same lookup."
              exit 1
            fi
          done
      # Review finding M1: shared with ci-server.yml's registry-validate job so the pinned version
      # + checksum can drift in exactly one place. See that action's header comment for the
      # checksum's verification sources. `id:` so the two steps below can consume its `bin` output
      # (review finding N5) instead of re-hardcoding "$RUNNER_TEMP/mcp-publisher" a second time.
      - uses: ./.github/actions/install-mcp-publisher
        id: install-mcp-publisher
        if: steps.preflight.outputs.already_published != 'true'
      # No secret exchanged here: this trades the job's own GitHub OIDC token for a short-lived MCP
      # Registry credential. `env:` per THE-541 (check-workflow-injection.mjs's own rule) rather
      # than inlining `${{ }}` directly into the script text.
      - name: authenticate to the MCP Registry (GitHub OIDC)
        if: steps.preflight.outputs.already_published != 'true'
        shell: bash
        env:
          MCP_PUBLISHER_BIN: ${{ steps.install-mcp-publisher.outputs.bin }}
        run: |
          "$MCP_PUBLISHER_BIN" login github-oidc
      # Reads server.json from the repo root (checked out above) by default — no path argument.
      - name: publish server.json to the MCP Registry
        if: steps.preflight.outputs.already_published != 'true'
        shell: bash
        env:
          MCP_PUBLISHER_BIN: ${{ steps.install-mcp-publisher.outputs.bin }}
        run: |
          "$MCP_PUBLISHER_BIN" publish

  build-binaries:
    # THE-542 dry-run guard: on a workflow_dispatch with dry_run, everything downstream of
    # build-native is skipped so the 8-target matrix can be proven without shipping anything.
    # A real release is a tag push, where github.event_name == 'push' and this is always true.
    if: github.event_name == 'push' || !inputs.dry_run
    # THE-575: was `needs: publish-npm`. This job builds from the TAG and consumes no
    # npm-published package, so gating it on the publish only meant that a publish failure made it
    # unreachable — which is how v1.11.0 shipped without its standalone binaries. Depends on
    # verify-tag ONLY: checked with a grep for download-artifact and this job consumes no native
    # artifact, so waiting on the 8-target matrix would just serialise the pipeline for nothing. An
    # unsigned tag still stops it, and draft-release still requires build-native to have succeeded
    # before a release is assembled.
    needs: verify-tag
    strategy:
      fail-fast: true
      matrix:
        include:
          # `smoke: true` where the host can EXECUTE its own output (host arch == target arch).
          # THE-578: this job used to compile and upload without ever running the result, so every
          # release shipped standalone binaries that died at module load — for v1.10.0 and v1.11.0
          # alike — and CI stayed green throughout. Compiling is not evidence that it runs.
          # The two cross-compiled rows (linux-arm64 on x64, darwin-x64 on an arm64 runner) cannot
          # self-smoke, but they are the same bundle for a different arch, so smoking one target per
          # OS covers the class. Prefer fixing the arch coverage over dropping the check if that
          # stops being true.
          - host: ubuntu-latest
            target: bun-linux-x64
            smoke: true
          - host: ubuntu-latest
            target: bun-linux-arm64
          - host: macos-latest
            target: bun-darwin-x64
          - host: macos-14
            target: bun-darwin-arm64
            smoke: true
          - host: windows-latest
            target: bun-windows-x64
            smoke: true
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - name: build shared
        working-directory: packages/shared
        run: bun run build
      # THE-663: bake this target's sqlite-vec vec0 binary into vec-embedded.ts BEFORE compiling.
      # `bun build --compile` freezes import.meta.url to this runner's path, so the npm-resolved
      # sqlite-vec (packages/server/src/search/vec.ts's first-choice path) cannot be found by the
      # shipped binary on any other machine — silently losing dense retrieval to the brute-force
      # fallback. Needed for every target, not only the two that cross-compile (linux-arm64 on this
      # x64 host, darwin-x64 on the arm64 macOS runner): a same-arch build is just as broken once
      # the binary leaves this runner. Regenerated fresh per target and never committed — see
      # scripts/gen-embedded-vec.mjs's header for why this can't be a single checked-in file the
      # way migrations-embedded.ts is.
      - name: embed sqlite-vec for this target
        run: node scripts/gen-embedded-vec.mjs --target ${{ matrix.target }}
        shell: bash
      # Darwin only. Embedding vec0 is necessary but NOT sufficient there: bun:sqlite uses Apple's
      # system SQLite, which is built without extension support, so db.loadExtension() throws
      # regardless. v1.14.0 is where this surfaced — the first time the smoke gate below ever ran,
      # since it only executes on a tag. Builds a universal2 vanilla SQLite and bakes it in; the
      # adapter calls setCustomSQLite() with it before opening any database. linux and windows get
      # an extension-capable SQLite from bun itself and skip this entirely.
      - name: embed vanilla SQLite (darwin only)
        if: startsWith(matrix.target, 'bun-darwin')
        run: node scripts/gen-embedded-sqlite.mjs --target ${{ matrix.target }}
        shell: bash
      # THE-705: --external the optional local-reranker package, the same reasoning as the npm dist
      # build's script in packages/server/package.json — it is never installed here (not a
      # dependency of packages/server; see packages/reranker-local/README.md), and its own
      # dependency (@huggingface/transformers, via onnxruntime-node) dlopens a sidecar .node/.so
      # that cannot survive being embedded in a single-file standalone binary regardless. Marking it
      # external keeps the dynamic import() a genuine runtime lookup instead of a bundler resolution
      # failure; the "local" reranker is unreachable from a compiled binary either way (documented,
      # not fought — see the THE-705 research brief), and this only ensures that fact doesn't also
      # break every OTHER provider's compile.
      - name: compile standalone binary
        run: bun build packages/server/src/cli.ts --compile --bytecode --minify --sourcemap --external @the-40-thieves/obsidian-tc-reranker-local --target=${{ matrix.target }} --outfile packages/server/dist/obsidian-tc-${{ matrix.target }}
        shell: bash
      # THE-578: RUN the thing we are about to ship. Two assertions, because the first alone is not
      # enough: `version` proves the module graph loads (the old failure was at load time, in
      # db/provision.ts's top-level migration chain, so even --version died), and the stdio smoke
      # proves it can actually PROVISION — which is what the embedded SQL exists for and what the
      # old binary could never do on any machine but the build runner.
      - name: smoke-test the compiled binary
        if: matrix.smoke
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # bun appends .exe on the windows target. Checked explicitly rather than globbed: the name
          # is deterministic, and `ls | head` would silently pick a wrong file (shellcheck SC2012).
          bin="packages/server/dist/obsidian-tc-$TARGET"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          [ -f "$bin" ] || { echo "::error::compiled binary not found at $bin"; exit 1; }
          echo "smoking: $bin"
          chmod +x "$bin" || true

          # THE-663: this smoke test runs in the SAME checkout that just compiled the binary, so
          # packages/server/node_modules/sqlite-vec still sits at the exact absolute path
          # import.meta.url got frozen to — the compiled binary's npm-require path would resolve
          # here even on the OLD, unfixed code (that is exactly why this shipped unnoticed for two
          # releases: "run it on the build machine" was never a real test). Deleting node_modules
          # first makes this runner match every real installation: the binary itself is now the
          # only thing it can be provisioning from, so vec=on below can only come from the
          # embedded fallback, not the require() path this bug is about.
          rm -rf node_modules packages/*/node_modules

          want=$(node -p "require('./packages/server/package.json').version")
          got=$("$bin" version)
          echo "version: want=$want got=$got"
          [ "$got" = "$want" ] || { echo "::error::binary reports '$got', expected '$want'"; exit 1; }

          # Provisioning smoke: a throwaway vault + cache, same helper the install-smoke lane uses.
          tmp=$(mktemp -d)
          node scripts/write-smoke-config.mjs "$tmp/vault" "$tmp/cache" "$tmp/config.json"
          out=$("$bin" "$tmp/config.json" < /dev/null 2>&1) || true
          echo "$out"
          echo "$out" | grep -q "ready on stdio" || {
            echo "::error::compiled binary did not reach stdio-ready — it cannot provision (THE-578)"
            exit 1
          }
          # THE-663: `ready on stdio` alone is not enough — it was already true for a binary that
          # had silently lost dense retrieval. This binary's own startup banner (cli.ts) reports
          # native=on/off and vec=on/off; assert vec actually loaded rather than having quietly
          # fallen back to the brute-force cosine scan, which is exactly what shipped, unnoticed,
          # in v1.10.0 and v1.11.0.
          echo "$out" | grep -q "vec=on" || {
            echo "::error::compiled binary reports vec=off — sqlite-vec did not load (THE-663); it silently fell back to the brute-force scan"
            exit 1
          }
          # Both migration chains must have produced a database, not just cache.db: the experiential
          # chain is assembled separately in cli.ts and was the second site reading SQL from disk.
          for db in cache.db experiential.db; do
            [ -f "$tmp/cache/$db" ] || { echo "::error::$db was not provisioned"; exit 1; }
          done
          echo "ok: $bin reports $want, reaches stdio-ready, and provisions both chains"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.target }}
          path: packages/server/dist/obsidian-tc-*

  build-plugin:
    # THE-542 dry-run guard: on a workflow_dispatch with dry_run, everything downstream of
    # build-native is skipped so the 8-target matrix can be proven without shipping anything.
    # A real release is a tag push, where github.event_name == 'push' and this is always true.
    if: github.event_name == 'push' || !inputs.dry_run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - name: build plugin
        working-directory: packages/plugin
        run: bun run build
      # Version comes from package.json, not the ref name. check-version-coherence.mjs already
      # asserts all 7 version strings agree, making it authoritative — whereas ${GITHUB_REF_NAME#v}
      # is only the version when the ref is a tag whose NAME encodes it. On any other ref it
      # silently produces nonsense, and the workflow declares a workflow_dispatch trigger, so a
      # non-tag ref is reachable: dispatching on a branch yielded
      # "obsidian-tc-plugin-release/v1.11.0-artifacts.zip", whose slash made zip fail with
      # "Could not create output file".
      - name: zip plugin
        run: |
          version=$(node -p "require('./packages/server/package.json').version")
          cd packages/plugin/dist
          zip -r "../obsidian-tc-plugin-${version}.zip" main.js manifest.json styles.css
        shell: bash
      # THE-943: obsidian-tc was renamed to tc-bridge/"TC Bridge" (the community directory bans
      # "obsidian" in a plugin id). Existing users on the OLD id get exactly one more release: a
      # sunset build (packages/plugin/legacy/) that only shows a notice pointing them at TC
      # Bridge — its manifest version was bumped once by hand and it is NOT part of the repo's
      # version lockstep (check-version-coherence.mjs does not track it; it never updates again).
      # Zipped under the existing `obsidian-tc-*` asset pattern below so draft-release's files:
      # glob (further down this workflow) picks it up with no change there. Its loose
      # manifest.json/main.js/styles.css are deliberately NOT uploaded standalone — those three
      # filenames are reserved for the tc-bridge community-store submission assets just above,
      # and a second same-named asset would collide on the GitHub release.
      - name: build legacy notice plugin (old id, final release)
        working-directory: packages/plugin
        run: node legacy/esbuild.config.mjs production
      - name: zip legacy notice plugin
        run: |
          legacy_version=$(node -p "require('./packages/plugin/legacy/manifest.json').version")
          cd packages/plugin/legacy/dist
          zip -r "../../obsidian-tc-legacy-final-notice-${legacy_version}.zip" main.js manifest.json styles.css
        shell: bash
      # Upload the zips AND the loose 3-file set (manifest.json + main.js + styles.css) so the release
      # attaches them as individual assets for BRAT sideloading (THE-206), not only the zip.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin
          path: |
            packages/plugin/obsidian-tc-plugin-*.zip
            packages/plugin/obsidian-tc-legacy-final-notice-*.zip
            packages/plugin/dist/manifest.json
            packages/plugin/dist/main.js
            packages/plugin/dist/styles.css

  build-docker:
    # THE-542 dry-run guard: on a workflow_dispatch with dry_run, everything downstream of
    # build-native is skipped so the 8-target matrix can be proven without shipping anything.
    # A real release is a tag push, where github.event_name == 'push' and this is always true.
    if: github.event_name == 'push' || !inputs.dry_run
    # THE-575: was `needs: publish-npm`. This job builds from the TAG and consumes no
    # npm-published package, so gating it on the publish only meant that a publish failure made it
    # unreachable — which is how v1.11.0 shipped without its ghcr image. Depends on
    # verify-tag ONLY: checked with a grep for download-artifact and this job consumes no native
    # artifact, so waiting on the 8-target matrix would just serialise the pipeline for nothing. An
    # unsigned tag still stops it, and draft-release still requires build-native to have succeeded
    # before a release is assembled.
    needs: verify-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Same reasoning as the plugin zip: on a non-tag ref the old form produced the docker tag
      # "ghcr.io/the-40-thieves/obsidian-tc:release/v1.11.0-artifacts", which buildx rejected as an
      # "invalid reference format" because a docker tag cannot contain a slash. Deriving from the
      # version also makes the prerelease test agree with publish-npm's (THE-574), which already
      # classifies from the version string rather than the ref: a tag named v1.12.0-beta.1 was
      # previously detected as a prerelease only because its NAME contained a hyphen.
      - name: extract version
        id: version
        run: |
          version=$(node -p "require('./packages/server/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: is pre-release
        id: prerelease
        run: |
          version=$(node -p "require('./packages/server/package.json').version")
          if [[ "$version" == *"-"* ]]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash
      # OCI labels are INHERITED from the base image unless overridden. oven/bun:1-slim carries its
      # own org.opencontainers.image.revision and .created, so the published image advertised Bun's
      # commit (0d9b296a, which exists in no obsidian-tc history) and Bun's build date (2026-05-13)
      # next to OUR source URL. That combination is worse than either label alone: `source` being
      # correct lends credibility to a `revision` that resolves to nothing, so anyone asking "which
      # commit built this image" got a confidently wrong answer. Override every field we assert.
      - name: build timestamp
        id: buildmeta
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
        shell: bash
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/the-40-thieves/obsidian-tc:${{ steps.version.outputs.version }}
            ${{ steps.prerelease.outputs.value == 'false' && 'ghcr.io/the-40-thieves/obsidian-tc:latest' || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/the-40-thieves/obsidian-tc
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.buildmeta.outputs.created }}
            org.opencontainers.image.title=obsidian-tc
      # An SBOM of the IMAGE, which nothing else produces. The THE-299 step in publish-npm runs
      # `npm sbom` over the three packages — npm dependency trees only. It cannot see what actually
      # ships in the container: the Debian base packages, the bun runtime, or the compiled native
      # binary. So the artefact users pull had no bill of materials at all.
      #
      # Complements rather than duplicates ci-docker's trivy scan. trivy answers "does this image
      # have known CVEs *today*"; an SBOM is the durable record of what was in it, which is what
      # answers "were we affected?" about a CVE disclosed six months from now — by which time the
      # tag is immutable and the scan is stale.
      #
      # Non-blocking, matching the npm SBOM step's stance: a release must not brick on SBOM
      # generation, but a failure is surfaced as a warning rather than swallowed.
      - name: syft — SBOM of the published image (SPDX)
        continue-on-error: true
        env:
          IMAGE: ghcr.io/the-40-thieves/obsidian-tc:${{ steps.version.outputs.version }}
        run: |
          set -uo pipefail
          mkdir -p sboms
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/v1.49.0/install.sh \
            | sh -s -- -b "$RUNNER_TEMP/syft-bin" v1.49.0
          if ! "$RUNNER_TEMP/syft-bin/syft" "$IMAGE" -o spdx-json > "sboms/obsidian-tc-image.spdx.json"; then
            echo "::warning::image SBOM generation failed for $IMAGE"
            rm -f sboms/obsidian-tc-image.spdx.json
          fi
          ls -la sboms/
      - name: upload image SBOM
        if: hashFiles('sboms/obsidian-tc-image.spdx.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-image
          path: sboms/

  build-mcpb:
    # THE-542 dry-run guard: on a workflow_dispatch with dry_run, everything downstream of
    # build-native is skipped so the 8-target matrix can be proven without shipping anything.
    # A real release is a tag push, where github.event_name == 'push' and this is always true.
    if: github.event_name == 'push' || !inputs.dry_run
    # THE-575: was `needs: publish-npm`. This job builds from the TAG and consumes no
    # npm-published package, so gating it on the publish only meant that a publish failure made it
    # unreachable — which is how v1.11.0 shipped without its MCPB bundle. Depends on
    # verify-tag ONLY: checked with a grep for download-artifact and this job consumes no native
    # artifact, so waiting on the 8-target matrix would just serialise the pipeline for nothing. An
    # unsigned tag still stops it, and draft-release still requires build-native to have succeeded
    # before a release is assembled.
    needs: verify-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - name: build shared + server
        run: |
          (cd packages/shared && bun run build)
          (cd packages/server && bun run build)
      - name: pack the .mcpb bundle
        run: bun run bundle
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcpb
          path: dist/obsidian-tc.mcpb

  draft-release:
    # THE-542 dry-run guard: on a workflow_dispatch with dry_run, everything downstream of
    # build-native is skipped so the 8-target matrix can be proven without shipping anything.
    # A real release is a tag push, where github.event_name == 'push' and this is always true.
    if: github.event_name == 'push' || !inputs.dry_run
    needs: [publish-npm, build-binaries, build-plugin, build-docker, build-mcpb]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          # only the assets the release attaches; skip native-* and the .dockerbuild record
          pattern: '{binary-*,plugin,mcpb}'
      - name: generate checksums
        run: |
          cd artifacts
          find . -type f \( -name 'obsidian-tc-*' -o -name '*.mcpb' -o -name '*.zip' \) -exec sha256sum {} \; > SHASUMS256.txt
        shell: bash
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          # publish on tag (was draft: true — releases were left as drafts, so "Latest" went stale)
          draft: false
          generate_release_notes: true
          # THE-731: `artifacts/**/*.zip` used to sit between the .mcpb and manifest.json lines and
          # was REDUNDANT — build-plugin emits exactly one zip, obsidian-tc-plugin-<version>.zip,
          # which already matches `obsidian-tc-*`. Being matched by two patterns queued it for
          # upload TWICE, and with overwrite_files the second copy takes the *update* path: it looks
          # up an asset the first copy has not finished creating, gets a 404, and fails the job.
          # It is the only double-match here (obsidian-tc.mcpb has no hyphen after `obsidian-tc`;
          # the bun binaries are not .zip), which is why the plugin bundle specifically went missing.
          # Do not re-add a pattern that overlaps another.
          files: |
            artifacts/**/obsidian-tc-*
            artifacts/**/*.mcpb
            artifacts/**/manifest.json
            artifacts/**/main.js
            artifacts/**/styles.css
            artifacts/SHASUMS256.txt

      # THE-731: the upload step's exit code is NOT sufficient evidence that the release is whole.
      # On v1.19.0 it exited non-zero having shipped 10 of 11 assets, and on v1.18.0 the same defect
      # exited ZERO because the race happened to fall the other way. Assert by name against the
      # generated manifest instead; the script explains why name-and-manifest rather than a
      # hardcoded count. Tag pushes only — a workflow_dispatch has no release to inspect.
      - name: verify every checksummed artifact is attached
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/check-release-assets.sh "${{ github.ref_name }}" artifacts/SHASUMS256.txt

name: release-image
# Build + push the GHCR image for a given version, decoupled from npm. publish.yml builds the
# image only on a v* tag (which also publishes npm). After a release where npm is already live,
# re-firing the tag would conflict on the immutable npm versions, so this dispatch rebuilds and
# pushes just the image for an existing version.
#
# Everything comes from ONE release: the source (Dockerfile, bundle, sqlite-vec pin in bun.lock) is
# checked out from the `v<version>` tag, the native prebuilds are the npm packages of that same
# version and are verified against that release's published Sigstore bundles, and the image is
# labelled and tagged with it. Dispatching from main therefore cannot mix current source with an
# older release's binaries. The corollary: a release whose tag predates the Dockerfile's native /
# sqlite-vec staging cannot be repaired here (its image fails the boot smoke and is never
# promoted); cut a new patch release through publish.yml instead.
#
# Trust: the workflow's own commit (checked out as trusted/) supplies the composite action and its smoke script.
# The release tag (checked out as src/) supplies only source, and it must verify against main's allowed_signers
# before anything else runs. No repo-local action or script from the tag is ever executed.
#
# The image is pushed to a staging tag, booted offline on linux/amd64 and linux/arm64 (native=on,
# vec=on), signed by that same digest, and only then does it get its public tags.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image version without leading v (e.g. 1.0.1)"
        required: true
        type: string
      latest:
        description: "Also tag :latest"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    # id-token: keyless cosign signature of the staged image, by digest (in the smoke-and-promote action).
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      # Dispatchable from main only. A tag dispatch would take this workflow file and trusted/ from that tag, which
      # bypasses the trusted/src split below. Visible failure, before any checkout or credential is used.
      - name: refuse a dispatch from anything but main
        env:
          REF: ${{ github.ref }}
        run: |
          [ "$REF" = "refs/heads/main" ] || { echo "::error::release-image must be dispatched from main (the trusted workflow ref); the tag to rebuild is the version input"; exit 1; }
        shell: bash
      # The version becomes a git ref and a package spec: refuse anything that is not a plain
      # semver (no leading v, no path or shell characters) before it reaches either.
      - name: validate the version input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::version must be a plain semver without a leading v, got '$VERSION'"; exit 1; }
        shell: bash
      # The workflow's own commit, kept apart as trusted/: the composite action and its smoke script come from
      # here, never from the release tag. Only dispatchable from main (the first step refuses any other ref), so this
      # is main's copy: main is protected, and a tag can never supply this file.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
      # Source from the release tag, in src/, not from whatever ref the workflow was dispatched on. The tag itself
      # must be a signed release tag: the same rule publish.yml's verify-tag enforces. fetch-depth 0: a tag's
      # object and signature are not in a shallow clone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v${{ inputs.version }}
          fetch-depth: 0
          path: src
      - name: verify the release tag is signed by an allowed signer
        working-directory: src
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # The signers come from main, never from the tag: a tag's own allowed_signers is whatever its author wrote.
          git fetch --no-tags origin main
          git show origin/main:.github/allowed_signers > "$RUNNER_TEMP/allowed_signers"
          [ -s "$RUNNER_TEMP/allowed_signers" ] || { echo "::error::origin/main has no non-empty .github/allowed_signers; refusing to release"; exit 1; }
          git -c gpg.ssh.allowedSignersFile="$RUNNER_TEMP/allowed_signers" verify-tag "refs/tags/v${VERSION}"
        shell: bash
      - name: assert the checked-out source is the requested release
        id: source
        working-directory: src
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          have=$(node -p "require('./packages/server/package.json').version")
          [ "$have" = "$VERSION" ] || { echo "::error::tag v${VERSION} holds package version ${have}, not ${VERSION}"; exit 1; }
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        shell: bash
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'
      # The image ships the compiled native module for its arch (the Dockerfile copies it from the
      # build context and fails the build if it is missing). npm is already live for this version
      # (that is what this workflow is for), so take the two glibc prebuilds from the published
      # platform packages instead of rebuilding them. They arrive through the npm registry, so each
      # is verified against the Sigstore bundle publish.yml's sign-artifacts job attached to this
      # release (the native prebuilds are not release assets themselves, only their bundles are),
      # pinned to that workflow at this release's tag, BEFORE it is staged into the build context.
      - name: fetch the published native prebuilds (linux x64 + arm64, glibc) and verify their signatures
        working-directory: src
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IDENTITY="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/publish.yml@refs/tags/v${VERSION}"
          ISSUER=https://token.actions.githubusercontent.com
          work=$(mktemp -d)
          for arch in x64 arm64; do
            pkg="@the-40-thieves/obsidian-tc-native-linux-${arch}-gnu"
            file="obsidian-tc-native.linux-${arch}-gnu.node"
            (cd "$work" && tgz=$(npm pack "${pkg}@${VERSION}" --silent) \
              && tar -xzf "$tgz" --strip-components=1 "package/${file}" && rm -f "$tgz")
            gh release download "v${VERSION}" --pattern "${file}.sigstore.json" --dir "$work"
            cosign verify-blob --bundle "$work/${file}.sigstore.json" \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer "$ISSUER" "$work/${file}"
            mv "$work/${file}" "packages/native/${file}"
          done
          ls -l packages/native/*.node
        shell: bash
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Same inheritance trap as publish.yml: oven/bun:1-slim's own revision/created labels survive
      # into our image unless overridden, so the artefact claimed Bun's commit under our source URL.
      - name: build timestamp
        id: buildmeta
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
        shell: bash
      # Staging tag only; the public tags move in the promote step once both platforms boot.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: push
        with:
          context: src
          file: src/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/the-40-thieves/obsidian-tc:smoke-${{ inputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/the-40-thieves/obsidian-tc
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}
            org.opencontainers.image.created=${{ steps.buildmeta.outputs.created }}
            org.opencontainers.image.title=obsidian-tc
      - name: boot-smoke both platforms, then promote the smoked digest to the public tags
        uses: ./trusted/.github/actions/smoke-and-promote-image
        with:
          image: ghcr.io/the-40-thieves/obsidian-tc
          digest: ${{ steps.push.outputs.digest }}
          tags: |
            ghcr.io/the-40-thieves/obsidian-tc:${{ inputs.version }}
            ${{ inputs.latest && 'ghcr.io/the-40-thieves/obsidian-tc:latest' || '' }}

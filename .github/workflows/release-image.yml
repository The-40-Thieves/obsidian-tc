name: release-image
# Build + push the GHCR image for a given version, decoupled from npm. publish.yml builds the
# image only on a v* tag (which also publishes npm). After a release where npm is already live,
# re-firing the tag would conflict on the immutable npm versions, so this dispatch rebuilds and
# pushes just the image for an existing version. Runs on the default branch (current Dockerfile).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image version without leading v (e.g. 1.0.1)"
        required: true
        type: string
      latest:
        description: "Also tag :latest"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Same inheritance trap as publish.yml: oven/bun:1-slim's own revision/created labels survive
      # into our image unless overridden, so the artefact claimed Bun's commit under our source URL.
      - name: build timestamp
        id: buildmeta
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
        shell: bash
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/the-40-thieves/obsidian-tc:${{ inputs.version }}
            ${{ inputs.latest && 'ghcr.io/the-40-thieves/obsidian-tc:latest' || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/the-40-thieves/obsidian-tc
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.buildmeta.outputs.created }}
            org.opencontainers.image.title=obsidian-tc

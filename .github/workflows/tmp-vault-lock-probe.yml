name: tmp-vault-lock-probe
on:
  push:
    branches: [fix/windows-vault-lock-keepalive]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: new, run: 1 }
          - { variant: new, run: 2 }
          - { variant: new, run: 3 }
          - { variant: new, run: 4 }
          - { variant: new, run: 5 }
          - { variant: old, run: 1 }
          - { variant: old, run: 2 }
          - { variant: old, run: 3 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: old variant restores the pre-fix vault-lock source and test
        if: matrix.variant == 'old'
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- packages/server/src/runtime/vault-lock.ts packages/server/test/vault-lock.test.ts
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
        working-directory: packages/shared
      - name: ino probe
        shell: bash
        run: node scripts/tmp-ino-probe.mjs
      - name: vault-lock tests
        shell: bash
        run: node ./node_modules/vitest/vitest.mjs run test/vault-lock.test.ts --reporter=verbose
        working-directory: packages/server

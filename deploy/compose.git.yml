# Long-lived HTTP deployment with the vault kept in step with a Git remote (the -git image). Run this
# file from deploy/ so ./config resolves beside it:
#   export OBSIDIAN_TC_PUBLIC_URL=https://vault.example.com
#   export OBSIDIAN_TC_JWT_SECRET='a random secret of at least 32 characters'
#   export OBSIDIAN_TC_VAULT_GIT_URL='git@github.com:org/vault.git'
#   export OBSIDIAN_TC_VAULT_GIT_SSH_KEY="$(cat ./vault-deploy-key)"
#   docker compose -f compose.git.yml up -d
#
# The SSH key is read from the environment, never from a file mounted into the container. The key
# needs write access if the vault is written by the server (the default push mode, batched). For an
# HTTPS remote, replace OBSIDIAN_TC_VAULT_GIT_SSH_KEY with OBSIDIAN_TC_VAULT_GIT_TOKEN.
#
# The -git tags are published from the next release on; until then this file does not resolve.
# The image's entrypoint is `git-sync --supervise`: it clones or verifies /data/vault, pulls on an
# interval, then runs the server. Either process exiting exits the container, and restart: unless-stopped
# brings it back. See docs/SYNC.md (git) and the Docker page for the full variable list.
#
# Optional: OBSIDIAN_TC_VAULT_GIT_KNOWN_HOSTS pins the remote's host key (otherwise the first key seen is
# trusted); OBSIDIAN_TC_VAULT_GIT_WEBHOOK_SECRET (at least 32 characters) enables POST /hooks/vault-sync.
#
# A new named volume inherits writable /data/vault and /data/cache directories from the image.
# The image HEALTHCHECK is inherited, so no Compose healthcheck is duplicated here.
services:
  obsidian-tc:
    image: ghcr.io/the-40-thieves/obsidian-tc:latest-git
    restart: unless-stopped
    environment:
      OBSIDIAN_TC_CONFIG: /config/obsidian-tc.config.json
      OBSIDIAN_TC_VAULT_PATH: /data/vault
      OBSIDIAN_TC_CACHE_DIR: /data/cache
      PORT: "${PORT:-8765}"
      OBSIDIAN_TC_PUBLIC_URL: "${OBSIDIAN_TC_PUBLIC_URL:?Set OBSIDIAN_TC_PUBLIC_URL to the public HTTPS origin}"
      OBSIDIAN_TC_JWT_SECRET: "${OBSIDIAN_TC_JWT_SECRET:?Set OBSIDIAN_TC_JWT_SECRET to a random secret of at least 32 characters}"
      OBSIDIAN_TC_VAULT_GIT_URL: "${OBSIDIAN_TC_VAULT_GIT_URL:?Set OBSIDIAN_TC_VAULT_GIT_URL to the vault repository URL}"
      OBSIDIAN_TC_VAULT_GIT_SSH_KEY: "${OBSIDIAN_TC_VAULT_GIT_SSH_KEY:?Set OBSIDIAN_TC_VAULT_GIT_SSH_KEY to the private key contents}"
      OBSIDIAN_TC_VAULT_GIT_KNOWN_HOSTS: "${OBSIDIAN_TC_VAULT_GIT_KNOWN_HOSTS:-}"
      OBSIDIAN_TC_VAULT_GIT_WEBHOOK_SECRET: "${OBSIDIAN_TC_VAULT_GIT_WEBHOOK_SECRET:-}"
    ports:
      - "${PORT:-8765}:${PORT:-8765}"
    volumes:
      - obsidian-tc-data:/data
      - ./config:/config:ro

volumes:
  obsidian-tc-data:

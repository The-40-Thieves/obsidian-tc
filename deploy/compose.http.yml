# Long-lived HTTP deployment. Run this file from deploy/ so ./config resolves beside it:
#   export OBSIDIAN_TC_PUBLIC_URL=https://vault.example.com
#   export OBSIDIAN_TC_JWT_SECRET='a random secret of at least 32 characters'
#   docker compose -f compose.http.yml up -d
#
# A new named volume inherits writable /data/vault and /data/cache directories from the image.
# After `up`, seed notes with:
#   docker compose -f compose.http.yml cp /path/to/vault/. obsidian-tc:/data/vault
#
# The image HEALTHCHECK is inherited, so no Compose healthcheck is duplicated here.
# Bundled-AS alternative: enable auth.as in the config and use OBSIDIAN_TC_AS_SETUP_TOKEN instead
# of OBSIDIAN_TC_JWT_SECRET for the one-time operator claim; remove the setup token afterwards.
services:
  obsidian-tc:
    image: ghcr.io/the-40-thieves/obsidian-tc:latest
    restart: unless-stopped
    environment:
      OBSIDIAN_TC_CONFIG: /config/obsidian-tc.config.json
      OBSIDIAN_TC_VAULT_PATH: /data/vault
      OBSIDIAN_TC_CACHE_DIR: /data/cache
      PORT: "${PORT:-8765}"
      OBSIDIAN_TC_PUBLIC_URL: "${OBSIDIAN_TC_PUBLIC_URL:?Set OBSIDIAN_TC_PUBLIC_URL to the public HTTPS origin}"
      OBSIDIAN_TC_JWT_SECRET: "${OBSIDIAN_TC_JWT_SECRET:?Set OBSIDIAN_TC_JWT_SECRET to a random secret of at least 32 characters}"
    ports:
      - "${PORT:-8765}:${PORT:-8765}"
    volumes:
      - obsidian-tc-data:/data
      - ./config:/config:ro

volumes:
  obsidian-tc-data:

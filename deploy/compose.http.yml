# Long-lived HTTP deployment. Run this file from deploy/ so ./config resolves beside it:
#   export RELIQUARY_TC_PUBLIC_URL=https://vault.example.com
#   export RELIQUARY_TC_JWT_SECRET='a random secret of at least 32 characters'
#   docker compose -f compose.http.yml up -d
#
# A new named volume inherits writable /data/vault and /data/cache directories from the image.
# After `up`, seed notes with:
#   docker compose -f compose.http.yml cp /path/to/vault/. reliquary-tc:/data/vault
#
# The image HEALTHCHECK is inherited, so no Compose healthcheck is duplicated here.
# Bundled-AS alternative: enable auth.as in the config and use RELIQUARY_TC_AS_SETUP_TOKEN instead
# of RELIQUARY_TC_JWT_SECRET for the one-time operator claim; remove the setup token afterwards.
services:
  reliquary-tc:
    image: ghcr.io/the-40-thieves/reliquary-tc:latest
    restart: unless-stopped
    environment:
      RELIQUARY_TC_CONFIG: /config/reliquary-tc.config.json
      RELIQUARY_TC_VAULT_PATH: /data/vault
      RELIQUARY_TC_CACHE_DIR: /data/cache
      PORT: "${PORT:-8765}"
      RELIQUARY_TC_PUBLIC_URL: "${RELIQUARY_TC_PUBLIC_URL:?Set RELIQUARY_TC_PUBLIC_URL to the public HTTPS origin}"
      RELIQUARY_TC_JWT_SECRET: "${RELIQUARY_TC_JWT_SECRET:?Set RELIQUARY_TC_JWT_SECRET to a random secret of at least 32 characters}"
    ports:
      - "${PORT:-8765}:${PORT:-8765}"
    volumes:
      - reliquary-tc-data:/data
      - ./config:/config:ro

volumes:
  reliquary-tc-data:

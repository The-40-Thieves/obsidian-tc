# documentation: https://obsidian-tc.the40thieves.io/deployment/self-hosted-paas/
# slogan: An MCP server over an Obsidian vault, for AI clients over HTTP.
# category: productivity
# tags: obsidian,mcp,notes,knowledge,ai
# logo: svgs/reliquary-tc.svg
# port: 8765
#
# Paste into Coolify as a Docker Compose resource. Derived from deploy/compose.http.yml; the image
# HEALTHCHECK (/healthz) is inherited. Attach an https domain: RELIQUARY_TC_PUBLIC_URL must be https.
services:
  reliquary-tc:
    image: ghcr.io/the-40-thieves/reliquary-tc:latest
    environment:
      - SERVICE_URL_RELIQUARY_TC_8765
      - RELIQUARY_TC_CONFIG=/config/reliquary-tc.config.json
      - RELIQUARY_TC_VAULT_PATH=/data/vault
      - RELIQUARY_TC_CACHE_DIR=/data/cache
      - PORT=8765
      - RELIQUARY_TC_PUBLIC_URL=${SERVICE_URL_RELIQUARY_TC}
      - RELIQUARY_TC_JWT_SECRET=${SERVICE_PASSWORD_64_RELIQUARYTC}
    volumes:
      - reliquary-tc-data:/data
      - type: bind
        source: ./config/reliquary-tc.config.json
        target: /config/reliquary-tc.config.json
        content: |
          {
            "vaults": [{ "id": "main", "path": "/data/vault" }],
            "transports": { "stdio": false, "http": { "host": "0.0.0.0" } },
            "auth": { "mode": "jwt", "requireJti": true }
          }

volumes:
  reliquary-tc-data:

# Dokploy Compose template for reliquary-tc. Derived from deploy/compose.http.yml; the variables and
# the mounted config come from template.toml. The image HEALTHCHECK (/healthz) is inherited.
services:
  reliquary-tc:
    image: ghcr.io/the-40-thieves/reliquary-tc:latest
    restart: unless-stopped
    expose:
      - 8765
    environment:
      RELIQUARY_TC_CONFIG: /config/reliquary-tc.config.json
      RELIQUARY_TC_VAULT_PATH: /data/vault
      RELIQUARY_TC_CACHE_DIR: /data/cache
      PORT: "8765"
      RELIQUARY_TC_PUBLIC_URL: ${RELIQUARY_TC_PUBLIC_URL}
      RELIQUARY_TC_JWT_SECRET: ${RELIQUARY_TC_JWT_SECRET}
    volumes:
      - reliquary-tc-data:/data
      - ../files/reliquary-tc.config.json:/config/reliquary-tc.config.json:ro

volumes:
  reliquary-tc-data: {}

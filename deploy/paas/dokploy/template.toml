[variables]
main_domain = "${domain}"
jwt_secret = "${password:64}"

[config]
env = [
  "RELIQUARY_TC_PUBLIC_URL=https://${main_domain}",
  "RELIQUARY_TC_JWT_SECRET=${jwt_secret}",
]

[[config.domains]]
serviceName = "reliquary-tc"
port = 8765
host = "${main_domain}"

[[config.mounts]]
filePath = "reliquary-tc.config.json"
content = """
{
  "vaults": [{ "id": "main", "path": "/data/vault" }],
  "transports": { "stdio": false, "http": { "host": "0.0.0.0" } },
  "auth": { "mode": "jwt", "requireJti": true }
}
"""

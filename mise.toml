# Developer toolchain. Pinned to exact versions so two machines cannot silently disagree — a
# floating minor means "whatever was current when you installed", which is the one thing a pin
# exists to prevent.
#
# Each pin below matches something already authoritative elsewhere in the repo; none were chosen
# freely. Change one of these and change its counterpart in the same commit.
[tools]
# Matches BOTH .github/actions/setup-repo (bun-version default '1.4.2') and package.json's
# `packageManager: "bun@1.4.2"`. Bumped from 1.3.14 (THE-946): the root `bun audit` (509
# packages) hung on 1.3.14 until the client's five-minute timeout — 1.3.14's fetch idle timer
# did not cover the TLS handshake phase, so a stalled handshake to the npm advisory endpoint
# blocked forever instead of failing fast. 1.4.0 arms the idle timer in `on_open`, covering the
# handshake, and the same audit completes in ~17s.
#
# Bumped to 1.4.2 (THE-1118, 2026-09-24 stack-update review): keeps the pin current on a
# routine patch bump; also the version the Dockerfile's two `FROM oven/bun:` stages must match
# per check-bun-version-coherence.mjs.
bun = "1.4.2"

# Node 26 is the TARGET runtime and this pin is the exact version developed against. Every package
# still declares `engines.node: ">=24"`: 24 is the supported FLOOR, and CI still validates it — the
# full server suite runs on both 26 and 24 (ci-server.yml `build-test`, ci-native.yml
# `fallback-test`), and `perf:node-parity` runs on both. So you develop on the target and CI catches
# a Node-26-only API before it ships to a user on the floor.
#
# CI's general-purpose jobs follow the target through .github/actions/setup-repo's `node-version`
# default ('26'); the jobs that pin '24' explicitly are deliberate floor coverage.
#
# `perf:node-parity` is the job that actually executes under Node, so a dev/CI major mismatch
# would surface there first.
node = "26.10.0"

# Both Python services declare `requires-python = ">=3.10"` (services/bge-m3-service,
# services/docs-ingest) as their SUPPORTED range; 3.14 is what they are built and tested against
# (ci-model-service.yml sets up `python-version: '3.14'`, and ci-security.yml's checkov job runs on
# the same), so it is what a developer should get — not whatever python3 the OS happens to ship.
#
# This was 3.11 on the argument that much of the ML wheel ecosystem lagged 3.14. Checked and no
# longer true: every dependency of both services, including the heavy stack (torch 2.14,
# FlagEmbedding 1.4.2, sentence-transformers 5.7, transformers 5.19, docling 2.135, langextract
# 1.7), installs binary-only (`--only-binary :all:`) on cp314 for linux x86_64 (CI) and aarch64,
# and the hash-locked requirements*.txt resolve for 3.14 with their pins unchanged. Neither service
# depends on onnxruntime. torch comes from the CPU index on aarch64: the PyPI aarch64 wheel pulls
# the CUDA stack, which has no place on a GPU-less box.
#
# Pinned to the minor, matching CI's specificity exactly. A patch pin here would be MORE specific
# than the thing it is meant to agree with, which just relocates the divergence.
python = "3.14"

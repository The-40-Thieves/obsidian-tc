[package]
name = "obsidian-tc-native"
version = "0.0.0"
edition = "2024"
# THE-542: without this, a too-old toolchain fails with an opaque edition-2024 parse error instead of
# "package requires rustc 1.97". Kept in step with packages/native/rust-toolchain.toml.
rust-version = "1.97"
license = "AGPL-3.0-only"
description = "Native perf module for obsidian-tc"
repository = "https://github.com/The-40-Thieves/obsidian-tc"

[lib]
# `cdylib` is what napi-rs loads at runtime. `rlib` is added so `benches/` can link against the
# SHIPPED kernels instead of re-declaring them: the bench previously carried a hand-copied
# `cosine_batch_core` with a "kept in lockstep manually — re-copy if that function changes" note,
# which is a drift hazard that silently benchmarks code that is not the code. The rlib artifact is
# build-time only — it is not published and does not change the napi surface.
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "3", features = ["napi8"] }
napi-derive = "3"

# Vector and matrix ops (pinned in G2.5)
# ndarray = "0.16"
# nalgebra = "0.33"

# SQLite extension (pinned in G2.3)
# sqlite-vec = "0.1"

# V2-only — commented until V2 work begins
# petgraph = "0.6"

[build-dependencies]
napi-build = "2"

# THE-272: symlink-safe, TOCTOU-free vault file I/O via per-component openat(O_NOFOLLOW). Unix only —
# the Windows path uses std (symlink creation there is admin/developer-mode gated).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[dev-dependencies]
criterion = "0.8.2"

# THE-504: old-vs-new cosine_batch algorithm + f32-vs-f64-accumulation benches. `harness = false`
# because Criterion provides its own `main` (via `criterion_main!`) instead of libtest's.
[[bench]]
name = "cosine_batch"
harness = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "obsidian-tc-docs-ingest"
version = "0.1.0"
description = "Vendor/external-docs ingestion for obsidian-tc: a Docling/crawl4ai parse-router + LangExtract, writing md+frontmatter into a corpus vault (THE-444)"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.13",
]

[project.optional-dependencies]
# Live parse/extract backends, imported lazily so the router + writer core and its tests need
# none of them. Docling parses PDFs/Office; LangExtract does the grounded structured extraction.
# Web pages go to a self-hosted crawl4ai server over plain HTTP (urllib), so there is deliberately
# no client library here — the previous firecrawl-py backend was a metered hosted API that took
# every web ingest down with HTTP 402 when credits ran out.
# LangExtract's OpenAI provider imports the `openai` package lazily, and it is not a hard
# dependency of langextract itself -- pull it in via langextract's own `openai` extra so the
# provider that talks to Cave's LiteLLM gateway (OpenAI-compatible) actually has a client.
parse = ["docling>=2"]
extract = ["langextract[openai]>=1.5"]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["obsidian_tc_docs_ingest"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

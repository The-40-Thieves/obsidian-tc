# CI-based analysis for SonarQube Cloud.
#
# This file is inert until Automatic Analysis is turned OFF for the project, under
# Administration > Analysis Method. The two methods cannot both run on one project, and coverage
# is not supported under Automatic Analysis at all, which is the whole reason this exists.
#
# Both keys were read from the live project (sonarcloud.io/api/components/show), not guessed.
sonar.projectKey=The-40-Thieves_obsidian-tc
sonar.organization=the-40-thieves

# Coverage comes from the server suite only: it is the one workspace with a coverage run
# (ci-server.yml, ubuntu-latest + Node 26). The other packages, the Rust crate and the Python
# services report nothing yet, so repository-wide coverage will read low until they do. Per-pull-
# request new-code coverage, which is what the quality gate actually measures, is accurate for
# server changes today.
sonar.javascript.lcov.reportPaths=packages/server/coverage/lcov.info

# sonar.sources is REQUIRED. Leaving it out is what broke the first CI-based run: sonar.tests on
# its own left the scanner with zero MAIN files, and analysis 15 of main (0c0f6604) came back with
# an empty measures array -- ncloc fell from 394,917 to nothing, no LCOV sensor ran at all, and
# the gate read "Green (was Red)" because there was nothing left to measure.
#
# sonar.sources and sonar.tests must describe DISJOINT sets or the analysis fails outright with
# "File ... can't be indexed twice", and the scan step is continue-on-error, so that failure would
# be swallowed exactly as the first one was. sonar.sources takes simple paths and allows no
# wildcards, so "the root, except one directory" cannot be written here; the test tree is removed
# from the MAIN set through sonar.exclusions below instead. That keeps the root scope without
# enumerating every source directory by hand -- a list that silently drops whatever it omits.
sonar.sources=.
sonar.tests=packages/server/test

# Coverage is measured for packages/server/src ONLY -- that is vitest's `include` -- so every other
# file is uninstrumented by construction, not untested by accident. Without this, Sonar counts each
# of them as 0% covered and the headline figure measures how much of the repo vitest looks at
# rather than how well the server is tested. The tail of this list mirrors the `exclude` array in
# packages/server/vitest.config.ts; the two are duplicated with nothing gating them, so a file
# added there needs adding here.
sonar.coverage.exclusions=packages/plugin/**,packages/shared/**,packages/native/**,packages/reranker-local/**,packages/embedder-local/**,scripts/**,examples/**,services/**,docs/**,packages/server/test/**,packages/server/eval/**,packages/server/bun-smoke/**,packages/server/scripts/**,**/*.config.ts,**/*.config.mjs,packages/server/src/index.ts,packages/server/src/cli.ts,packages/server/src/db/types.ts,packages/server/src/db/bun-sqlite.ts,packages/server/src/db/node-better-sqlite3.ts,packages/server/src/transports/stdio.ts
# packages/server/test is listed here so the MAIN set excludes it; sonar.tests then claims it.
# Dropping that entry without dropping sonar.tests is the "indexed twice" failure above.
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/generated/**,**/*.d.ts,packages/server/test/**
sonar.scm.provider=git

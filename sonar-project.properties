# CI-based analysis for SonarQube Cloud.
#
# This file is inert until Automatic Analysis is turned OFF for the project, under
# Administration > Analysis Method. The two methods cannot both run on one project, and coverage
# is not supported under Automatic Analysis at all, which is the whole reason this exists.
#
# Both keys were read from the live project (sonarcloud.io/api/components/show), not guessed.
sonar.projectKey=The-40-Thieves_obsidian-tc
sonar.organization=the-40-thieves

# Coverage comes from the server suite only: it is the one workspace with a coverage run
# (ci-server.yml, ubuntu-latest + Node 26). The other packages, the Rust crate and the Python
# services report nothing yet, so repository-wide coverage will read low until they do. Per-pull-
# request new-code coverage, which is what the quality gate actually measures, is accurate for
# server changes today.
sonar.javascript.lcov.reportPaths=packages/server/coverage/lcov.info

# Analysis scope stays at the repository root on purpose, matching what Automatic Analysis already
# covered. Narrowing it is a follow-up once the first CI-based run shows what it picks up.
sonar.tests=packages/server/test
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/generated/**,**/*.d.ts
sonar.scm.provider=git
